          MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true" AND r.DestService IN ["HTTP Management", "HTTP Redirect Page Serving", "SNMP"] RETURN r.Priority AS Priority;
