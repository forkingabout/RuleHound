  - Name: "User Account Names Contained \"admin\""
    Severity: 3.7
    CumulativeRisk: false
    Intro:
      Singular: |-
        The affected asset uses predictable account names that contain the word admin. The following accounts were identified:
      Plural: |-
        The affected assets use predictable account names that contain the word admin. The following accounts were identified:
    GlobalVars: []
    Subs:
      - Name: "User Accounts Containing \"admin\""
        Audit: |-
          MATCH (u:User)
          WHERE toLower(u.ObjectName) CONTAINS "admin"
          RETURN u.ObjectName AS UserAccount
          ORDER BY UserAccount;
        SoloSeverity: 3.7
        CumulativeSeverity: 1.5
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (u:User)
              WHERE toLower(u.ObjectName) CONTAINS "admin"
              WITH u ORDER BY u.ObjectName
              WITH collect(u) AS users
              WHERE size(users) > 0
              RETURN "| User Account | Comment |\n|---|---|\n" +
                     reduce(s = "", u IN users | s + "| " + CASE WHEN u.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(u.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN u.Comment IS NULL THEN "(not set)" WHEN trim(toString(u.Comment)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.Comment), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset has local user accounts whose names contain the word admin. Predictable account names give an attacker one half of the credential pair and are the first usernames tried in brute force attacks against the user login and virtual private network (VPN) portals. Usernames that include the word admin also suggest that the account holds elevated privileges, which makes it an attractive target. Once an attacker has a likely username, password spraying and credential stuffing attacks against the user login and virtual private network (VPN) portals become considerably more effective.
