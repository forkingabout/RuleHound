            SoloText:
              Singular: |-
                Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration**, and open the Login and Multiple Administrators section, set the minimum number of lower case characters to at least 1, and apply the password constraints to every class of administrator and user account. Require existing local accounts to change their passwords so that the new policy takes effect for every account.
