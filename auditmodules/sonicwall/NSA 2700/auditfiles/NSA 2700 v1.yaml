  - Name: "Unused Firewall Configuration Objects"
    Severity: 2.0
    CumulativeRisk: false
    Intro:
      Singular: |-
        The configuration of the affected asset contains zones, address objects, service objects and interfaces that no access rule uses. Unused configuration objects add complexity, slow down rule reviews, and create a risk that stale definitions are reused in new rules without being checked. The following issues were identified:
      Plural: |-
        The configuration of the affected assets contains zones, address objects, service objects and interfaces that no access rule uses. Unused configuration objects add complexity, slow down rule reviews, and create a risk that stale definitions are reused in new rules without being checked. The following issues were identified:
    GlobalVars: []
    Subs:
      - Name: "Zones Unrestricted By Access Rules"
        Audit: |-
          MATCH (z:Zone)
          WHERE NOT exists { MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6) AND (r.SourceZone = z.ObjectName OR r.DestZone = z.ObjectName) }
          RETURN z.ObjectName AS Zone, z.ZoneType AS ZoneType
          ORDER BY Zone;
        SoloSeverity: 2.0
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (z:Zone)
              WHERE NOT exists { MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6) AND (r.SourceZone = z.ObjectName OR r.DestZone = z.ObjectName) }
              WITH z ORDER BY z.ObjectName
              WITH collect(z) AS zones
              WHERE size(zones) > 0
              RETURN "| Zone | ZoneType |\n|---|---|\n" +
                     reduce(s = "", z IN zones | s + "| " + CASE WHEN z.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(z.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN z.ZoneType IS NULL THEN "(not set)" WHEN trim(toString(z.ZoneType)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.ZoneType), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset defines the zones listed in the evidence, which are not used as the source zone or destination zone of any access rule. Traffic entering or leaving these zones is governed only by the default behaviour of SonicOS rather than by rules that reflect the organisation's requirements. Unused zones add complexity to the configuration, and if an interface is later assigned to such a zone, traffic through it will be handled without any deliberate policy having been defined for it.
              Plural: |-
                The affected assets define the zones listed in the evidence, which are not used as the source zone or destination zone of any access rule. Traffic entering or leaving these zones is governed only by the default behaviour of SonicOS rather than by rules that reflect the organisation's requirements. Unused zones add complexity to the configuration, and if an interface is later assigned to such a zone, traffic through it will be handled without any deliberate policy having been defined for it.
