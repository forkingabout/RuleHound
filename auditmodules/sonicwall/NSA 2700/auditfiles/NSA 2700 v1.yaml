      - Name: "Log Storage Disabled"
        Audit: |-
          MATCH (l:LoggingSettings)
          WHERE coalesce(l.logUseStorage, "off") <> "on"
          RETURN l.logUseStorage AS logUseStorage, l.logStorDev AS logStorDev;
        SoloSeverity: 3.7
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (l:LoggingSettings)
              WHERE coalesce(l.logUseStorage, "off") <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| Log to storage | logUseStorage | " + CASE WHEN l.logUseStorage IS NULL THEN "(not set)" WHEN trim(toString(l.logUseStorage)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.logUseStorage), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Log storage device | logStorDev | " + CASE WHEN l.logStorDev IS NULL THEN "(not set)" WHEN trim(toString(l.logStorDev)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.logStorDev), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Log storage directory | log_storage_dir | " + CASE WHEN l.log_storage_dir IS NULL THEN "(not set)" WHEN trim(toString(l.log_storage_dir)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.log_storage_dir), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                When the configuration property `logUseStorage` is disabled, the affected asset retains events only in its in-memory event buffer. This buffer has a fixed size, is continuously overwritten as new events arrive, and is cleared entirely when the affected asset restarts or its firmware is upgraded. Historic events are therefore lost within a short period of normal operation, and are lost immediately if an attacker or an operational fault causes the affected asset to restart. Investigators would be unable to review activity that occurred before the most recent buffer rollover, which limits the organisation's ability to determine the scope and timeline of an incident.
              Plural: |-
