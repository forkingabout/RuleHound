      - Name: "No SNMPv3 Access Groups Defined"
        Audit: |-
          MATCH (s:SNMPSettings) WHERE s.snmp_Enable = "on"
          OPTIONAL MATCH (g:SNMPv3Access)
          WITH g ORDER BY g.Index
          WITH collect(g) AS entries
          WHERE size([g IN entries WHERE trim(coalesce(g.name, "")) <> "" OR trim(coalesce(g.groupName, "")) <> ""]) = 0
          RETURN size(entries) AS SNMPv3AccessEntries;
        SoloSeverity: 4.3
        CumulativeSeverity: 2.0
        Flag: []
        Vars:
