          MATCH (u:User) WHERE u.ObjectName CONTAINS "@" AND coalesce(u.OtpReq, "0") IN ["0", ""] RETURN u.ObjectName AS User;
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (u:User)
          WHERE coalesce(u.OtpReq, "0") IN ["0", ""]
          WITH u ORDER BY u.ObjectName
          WITH collect(u) AS users
          WHERE size(users) > 0
          RETURN "| User | One-Time Password Method (userObjOtpReq) | Comment |\n|---|---|---|\n" +
                 reduce(s = "", u IN users | s + "| " + CASE WHEN u.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(u.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN u.OtpReq IS NULL THEN "(not set)" WHEN trim(toString(u.OtpReq)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.OtpReq), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN u.Comment IS NULL THEN "(not set)" WHEN trim(toString(u.Comment)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.Comment), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset authenticates the local user accounts listed in the evidence with a password alone, because the configuration property `userObjOtpReq` is set to `0` for each of them. A compromised password therefore grants the network access, virtual private network (VPN) connectivity and policy privileges associated with the account, without any further verification of the user's identity. User credentials are among the most frequently compromised secrets through phishing, password reuse and malware, and remote access services are a primary target for attackers seeking initial access. Multi-factor authentication (MFA) ensures that a stolen password alone is not sufficient to gain access, which prevents the majority of credential-based attacks against these accounts.
