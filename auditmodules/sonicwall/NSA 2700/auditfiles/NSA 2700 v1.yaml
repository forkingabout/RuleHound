# SonicWall configuration audit for RuleHound (sonicwall_parser.py object model).
# Audit: 0 rows = configuration passes. Var 'evidence' returns one markdown table of real configuration values.
Meta:
  Vendor: "SonicWall"
  Model: "NSA 2700"
  Firmware: "7.3.3-7015-R9691"
  OS Version: "SonicOS 7"
  KnownCompatability:
  - "NSA 2700 Build 7.3.3-7015-R9691 SonicOS 7.3.3"
  KnownIncompatability: []
  AuditfileVersion: 2

SoloFindings:
  - Name: "Syslog Logging Not Enabled"
    Severity: 4.0
    Audit: |-
      OPTIONAL MATCH (l:LoggingSettings)
      WITH l
      WHERE l IS NULL OR trim(coalesce(l.syslogServerName, "")) IN ["", "0.0.0.0", "::"]
      RETURN l.syslogServerName AS syslogServerName, l.syslogServerPort AS syslogServerPort, l.syslogStandbyServerName AS syslogStandbyServerName;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          OPTIONAL MATCH (l:LoggingSettings)
          WITH l
          WHERE l IS NULL OR trim(coalesce(l.syslogServerName, "")) IN ["", "0.0.0.0", "::"]
          RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                 "| Primary syslog server | syslogServerName | " + CASE WHEN l.syslogServerName IS NULL THEN "(not set)" WHEN trim(toString(l.syslogServerName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.syslogServerName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                 "| Syslog server port | syslogServerPort | " + CASE WHEN l.syslogServerPort IS NULL THEN "(not set)" WHEN trim(toString(l.syslogServerPort)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.syslogServerPort), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                 "| Standby syslog server | syslogStandbyServerName | " + CASE WHEN l.syslogStandbyServerName IS NULL THEN "(not set)" WHEN trim(toString(l.syslogStandbyServerName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.syslogStandbyServerName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset forwards no events to a syslog server, because the configuration property `syslogServerName` is not set. All events exist only within the local log of the affected asset. The local log has a limited capacity and is overwritten as it fills, and any person holding administrative access to the affected asset can clear it in a single action. Consequently, no independent record of the activity of the affected asset would survive a compromise of the affected asset itself, and events from the affected asset cannot be correlated with events from servers, endpoints and other network devices in a security information and event management (SIEM) platform. This prevents the timely detection of attacks against the network perimeter and weakens the organisation's ability to investigate incidents and to meet its log retention obligations.
          Plural: |-
            The affected assets forward no events to a syslog server, because the configuration property `syslogServerName` is not set. All events exist only within the local log of the affected assets. The local log has a limited capacity and is overwritten as it fills, and any person holding administrative access to the affected assets can clear it in a single action. Consequently, no independent record of the activity of the affected assets would survive a compromise of the affected assets itself, and events from the affected assets cannot be correlated with events from servers, endpoints and other network devices in a security information and event management (SIEM) platform. This prevents the timely detection of attacks against the network perimeter and weakens the organisation's ability to investigate incidents and to meet its log retention obligations.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Device**, then **Log**, then **Syslog**, and add the organisation's syslog collector or security information and event management (SIEM) platform as a syslog server, using the server's address and the port on which it listens. Configure a second, standby syslog server so that events continue to be delivered when the primary collector is unavailable. Restrict the access rule that permits syslog traffic so that it applies only to the collector's address. Where the collector supports it, use an encrypted transport for syslog. After the change, confirm at the collector that events from the affected asset, including administrator logins and denied connections, are being received and retained in line with the organisation's retention policy.
          Plural: |-
            Within the SonicOS management interface, navigate to **Device**, then **Log**, then **Syslog**, and add the organisation's syslog collector or security information and event management (SIEM) platform as a syslog server, using the server's address and the port on which it listens. Configure a second, standby syslog server so that events continue to be delivered when the primary collector is unavailable. Restrict the access rule that permits syslog traffic so that it applies only to the collector's address. Where the collector supports it, use an encrypted transport for syslog. After the change, confirm at the collector that events from the affected assets, including administrator logins and denied connections, are being received and retained in line with the organisation's retention policy.
  - Name: "No Session Timeout"
    Severity: 6.5
    Audit: |-
      WITH 15 AS maxMinutes
      OPTIONAL MATCH (a:AdministrationSettings)
      OPTIONAL MATCH (u:UserAuthSettings)
      OPTIONAL MATCH (v:SSLVPNSettings)
      WITH maxMinutes, [
        {setting: "Web administrator inactivity logout", property: "adminLoginTimeout", value: a.adminLoginTimeout, perMinute: 1},
        {setting: "CLI/SSH administrator idle timeout", property: "cli_idleTimeout", value: a.cli_idleTimeout, perMinute: 60},
        {setting: "Firewall user inactivity timeout", property: "userInactivity", value: u.userInactivity, perMinute: 1},
        {setting: "SSL VPN session timeout", property: "SslvpnsSessionTimeout", value: v.SslvpnsSessionTimeout, perMinute: 1}
      ] AS timeouts
      UNWIND timeouts AS t
      WITH maxMinutes, t, toInteger(t.value) AS raw
      WHERE t.value IS NOT NULL AND raw = 0
      RETURN t.setting AS Setting, t.property AS Property, t.value AS Value;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          WITH 15 AS maxMinutes
          OPTIONAL MATCH (a:AdministrationSettings)
          OPTIONAL MATCH (u:UserAuthSettings)
          OPTIONAL MATCH (v:SSLVPNSettings)
          WITH maxMinutes, [
            {setting: "Web administrator inactivity logout", property: "adminLoginTimeout", value: a.adminLoginTimeout, perMinute: 1},
            {setting: "CLI/SSH administrator idle timeout", property: "cli_idleTimeout", value: a.cli_idleTimeout, perMinute: 60},
            {setting: "Firewall user inactivity timeout", property: "userInactivity", value: u.userInactivity, perMinute: 1},
            {setting: "SSL VPN session timeout", property: "SslvpnsSessionTimeout", value: v.SslvpnsSessionTimeout, perMinute: 1}
          ] AS timeouts
          UNWIND timeouts AS t
          WITH maxMinutes, t, toInteger(t.value) AS raw
          WHERE t.value IS NOT NULL AND raw = 0
          WITH collect(t) AS rows
          WHERE size(rows) > 0
          RETURN "| Setting | Property | Value |\n|---|---|---|\n" + reduce(s = "", t IN rows | s + "| " + t.setting + " | " + t.property + " | " + CASE WHEN t.value IS NULL THEN "(not set)" WHEN trim(toString(t.value)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(t.value), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset does not end idle sessions for the services listed in the evidence, because the corresponding timeout value is set to `0`. An administrative or user session that is left open on an unattended workstation therefore remains authenticated indefinitely. Any person with physical access to that workstation can make changes with the full privileges of the logged-in account, and a session token captured from a browser, proxy or memory remains valid for as long as the session exists. For the administrative interface in particular, this means that a single unattended session can be used to alter the security policy of the affected asset, disable security services or create new administrator accounts without any further authentication.
          Plural: |-
            The affected assets do not end idle sessions for the services listed in the evidence, because the corresponding timeout value is set to `0`. An administrative or user session that is left open on an unattended workstation therefore remains authenticated indefinitely. Any person with physical access to that workstation can make changes with the full privileges of the logged-in account, and a session token captured from a browser, proxy or memory remains valid for as long as the session exists. For the administrative interface in particular, this means that a single unattended session can be used to alter the security policy of the affected assets, disable security services or create new administrator accounts without any further authentication.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration** and set the administrator inactivity logout, held in the configuration property `adminLoginTimeout`, to 10 minutes or less. Set the command line interface (CLI) idle timeout, held in `cli_idleTimeout`, to 600 seconds or less. Navigate to **Device**, then **Users**, then **Settings**, and set the user inactivity timeout, held in `userInactivity`, to 15 minutes or less. For the Secure Sockets Layer virtual private network (SSL VPN), navigate to **Network**, then **SSL VPN**, then **Server Settings**, and set the session timeout to 15 minutes or less. Apply each change and confirm through a fresh configuration export that none of these values is `0`.
          Plural: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration** and set the administrator inactivity logout, held in the configuration property `adminLoginTimeout`, to 10 minutes or less. Set the command line interface (CLI) idle timeout, held in `cli_idleTimeout`, to 600 seconds or less. Navigate to **Device**, then **Users**, then **Settings**, and set the user inactivity timeout, held in `userInactivity`, to 15 minutes or less. For the Secure Sockets Layer virtual private network (SSL VPN), navigate to **Network**, then **SSL VPN**, then **Server Settings**, and set the session timeout to 15 minutes or less. Apply each change and confirm through a fresh configuration export that none of these values is `0`.
  - Name: "Long Session Timeout"
    Severity: 4.3
    Audit: |-
      WITH 15 AS maxMinutes
      OPTIONAL MATCH (a:AdministrationSettings)
      OPTIONAL MATCH (u:UserAuthSettings)
      OPTIONAL MATCH (v:SSLVPNSettings)
      WITH maxMinutes, [
        {setting: "Web administrator inactivity logout", property: "adminLoginTimeout", value: a.adminLoginTimeout, perMinute: 1},
        {setting: "CLI/SSH administrator idle timeout", property: "cli_idleTimeout", value: a.cli_idleTimeout, perMinute: 60},
        {setting: "Firewall user inactivity timeout", property: "userInactivity", value: u.userInactivity, perMinute: 1},
        {setting: "SSL VPN session timeout", property: "SslvpnsSessionTimeout", value: v.SslvpnsSessionTimeout, perMinute: 1}
      ] AS timeouts
      UNWIND timeouts AS t
      WITH maxMinutes, t, toInteger(t.value) AS raw
      WHERE t.value IS NOT NULL AND raw > 0 AND toFloat(raw) / t.perMinute > maxMinutes
      RETURN t.setting AS Setting, t.property AS Property, t.value AS Value;
    Flag:
      - Message: "cli_idleTimeout is in seconds; the other timeouts are in minutes. Confirm units in the SonicOS UI before quoting durations."
        Query: |-
          MATCH (a:AdministrationSettings) WHERE toInteger(a.cli_idleTimeout) > 900 RETURN a.cli_idleTimeout AS cli_idleTimeout;
    Vars:
      - Name: "evidence"
        Query: |-
          WITH 15 AS maxMinutes
          OPTIONAL MATCH (a:AdministrationSettings)
          OPTIONAL MATCH (u:UserAuthSettings)
          OPTIONAL MATCH (v:SSLVPNSettings)
          WITH maxMinutes, [
            {setting: "Web administrator inactivity logout", property: "adminLoginTimeout", value: a.adminLoginTimeout, perMinute: 1},
            {setting: "CLI/SSH administrator idle timeout", property: "cli_idleTimeout", value: a.cli_idleTimeout, perMinute: 60},
            {setting: "Firewall user inactivity timeout", property: "userInactivity", value: u.userInactivity, perMinute: 1},
            {setting: "SSL VPN session timeout", property: "SslvpnsSessionTimeout", value: v.SslvpnsSessionTimeout, perMinute: 1}
          ] AS timeouts
          UNWIND timeouts AS t
          WITH maxMinutes, t, toInteger(t.value) AS raw
          WHERE t.value IS NOT NULL AND raw > 0 AND toFloat(raw) / t.perMinute > maxMinutes
          WITH collect(t) AS rows
          WHERE size(rows) > 0
          RETURN "| Setting | Property | Value |\n|---|---|---|\n" + reduce(s = "", t IN rows | s + "| " + t.setting + " | " + t.property + " | " + CASE WHEN t.value IS NULL THEN "(not set)" WHEN trim(toString(t.value)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(t.value), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset keeps idle sessions authenticated for longer than the recommended maximum of 15 minutes for the services listed in the evidence. An administrative browser or command line session that is left unattended remains usable for the full configured period. During that time, any person with access to the workstation, or an attacker who has captured the session token, can issue configuration changes with administrator privileges without authenticating. A long administrative session timeout also extends the window in which cross-site request forgery and session hijacking attacks against the management interface can succeed.
          Plural: |-
            The affected assets keep idle sessions authenticated for longer than the recommended maximum of 15 minutes for the services listed in the evidence. An administrative browser or command line session that is left unattended remains usable for the full configured period. During that time, any person with access to the workstation, or an attacker who has captured the session token, can issue configuration changes with administrator privileges without authenticating. A long administrative session timeout also extends the window in which cross-site request forgery and session hijacking attacks against the management interface can succeed.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration** and reduce the administrator inactivity logout, held in the configuration property `adminLoginTimeout`, to 10 minutes. Reduce the command line interface (CLI) idle timeout, held in `cli_idleTimeout`, to 600 seconds. Navigate to **Device**, then **Users**, then **Settings**, and reduce the user inactivity timeout to 15 minutes or less, and reduce the Secure Sockets Layer virtual private network (SSL VPN) session timeout to 15 minutes or less under **Network**, then **SSL VPN**, then **Server Settings**. Communicate the change to administrators, and confirm through a fresh configuration export that each value is at or below the recommended maximum.
          Plural: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration** and reduce the administrator inactivity logout, held in the configuration property `adminLoginTimeout`, to 10 minutes. Reduce the command line interface (CLI) idle timeout, held in `cli_idleTimeout`, to 600 seconds. Navigate to **Device**, then **Users**, then **Settings**, and reduce the user inactivity timeout to 15 minutes or less, and reduce the Secure Sockets Layer virtual private network (SSL VPN) session timeout to 15 minutes or less under **Network**, then **SSL VPN**, then **Server Settings**. Communicate the change to administrators, and confirm through a fresh configuration export that each value is at or below the recommended maximum.
  - Name: "No Network Filtering Rules Were Configured"
    Severity: 9.1
    Audit: |-
      OPTIONAL MATCH (r)
      WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true" AND NOT (coalesce(r.Comment, "") STARTS WITH "Auto" OR coalesce(r.DefaultRule, "") = "2")
      WITH count(r) AS administratorRules
      WHERE administratorRules = 0
      RETURN administratorRules AS AdministratorCreatedEnabledRules;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          OPTIONAL MATCH (c)
          WHERE (c:AccessRule OR c:AccessRuleV6) AND toString(c.Enabled) = "true" AND NOT (coalesce(c.Comment, "") STARTS WITH "Auto" OR coalesce(c.DefaultRule, "") = "2")
          WITH count(c) AS administratorRules
          WHERE administratorRules = 0
          OPTIONAL MATCH (r)
          WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true"
          WITH r ORDER BY r.SourceZone, r.DestZone, toInteger(r.Priority)
          WITH collect(r) AS rules
          RETURN "| IP Version | Priority | Source Zone | Destination Zone | Name | Comment |\n|---|---|---|---|---|---|\n" +
                 CASE WHEN size(rules) = 0 THEN "| (no enabled access rules) | | | | | |\n" ELSE
                 reduce(s = "", r IN rules | s + "| " + CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END + " | " + coalesce(replace(toString(r.Priority), "|", "\\|"), "(not set)") + " | " +
                        CASE WHEN r.SourceZone IS NULL THEN "(not set)" WHEN trim(toString(r.SourceZone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.SourceZone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.DestZone IS NULL THEN "(not set)" WHEN trim(toString(r.DestZone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.DestZone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(r.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.Comment IS NULL THEN "(not set)" WHEN trim(toString(r.Comment)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.Comment), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") END AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset enforces only the access rules that SonicOS generates automatically. Every enabled access rule either carries a comment beginning with the word Auto or is marked as a default rule, and no rule has been created by an administrator to reflect the organisation's own requirements. Traffic between zones is therefore governed entirely by the default behaviour of SonicOS, which includes a rule permitting all traffic from the trusted local area network (LAN) zone to the internet. No organisation-specific restriction exists on which hosts may communicate, which services they may use, or which destinations they may reach, so a compromised internal host can communicate freely with the internet and with other zones.
          Plural: |-
            The affected assets enforce only the access rules that SonicOS generates automatically. Every enabled access rule either carries a comment beginning with the word Auto or is marked as a default rule, and no rule has been created by an administrator to reflect the organisation's own requirements. Traffic between zones is therefore governed entirely by the default behaviour of SonicOS, which includes a rule permitting all traffic from the trusted local area network (LAN) zone to the internet. No organisation-specific restriction exists on which hosts may communicate, which services they may use, or which destinations they may reach, so a compromised internal host can communicate freely with the internet and with other zones.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Design and implement an access rule base that reflects the organisation's business requirements. Within the SonicOS management interface, navigate to **Policy**, then **Rules and Policies**, then **Access Rules**. For each pair of source and destination zones, create rules that permit only the specific source address objects, destination address objects and service objects that the business requires, and give each rule a comment identifying its purpose and owner. End each zone pair with an explicit rule that denies all remaining traffic and logs every match. Review the default rules generated by SonicOS and disable or restrict any that permit more than is required. Document the resulting rule base and review it at least annually.
          Plural: |-
            Design and implement an access rule base that reflects the organisation's business requirements. Within the SonicOS management interface, navigate to **Policy**, then **Rules and Policies**, then **Access Rules**. For each pair of source and destination zones, create rules that permit only the specific source address objects, destination address objects and service objects that the business requires, and give each rule a comment identifying its purpose and owner. End each zone pair with an explicit rule that denies all remaining traffic and logs every match. Review the default rules generated by SonicOS and disable or restrict any that permit more than is required. Document the resulting rule base and review it at least annually.
  - Name: "Rule Chains Do Not End In Catch All And Log"
    Severity: 5.3
    Audit: |-
      MATCH (r)
      WHERE (r:AccessRule OR r:AccessRuleV6)
      WITH CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END AS IPVersion, r.SourceZone AS SourceZone, r.DestZone AS DestZone,
           [x IN collect(r) WHERE toString(x.Enabled) = "true"] AS enabled
      WITH IPVersion, SourceZone, DestZone,
           reduce(last = null, x IN enabled |
                  CASE WHEN last IS NULL OR toInteger(x.Index) > toInteger(last.Index) THEN x ELSE last END) AS last
      WHERE last IS NULL
         OR last.SourceNet <> "Any" OR last.DestNet <> "Any" OR last.DestService <> "Any"
         OR coalesce(toString(last.Log), "0") <> "1"
      RETURN IPVersion, SourceZone, DestZone, last.Index AS LastRuleIndex, last.ObjectName AS LastRule, last.Log AS Log
      ORDER BY IPVersion, SourceZone, DestZone;
    Flag:
      - Message: "Zone pairs with no enabled rules have no catch-all rule at all; SonicOS still drops their traffic implicitly but logs nothing."
        Query: |-
          MATCH (r) WHERE r:AccessRule OR r:AccessRuleV6 WITH r.SourceZone AS s, r.DestZone AS d, collect(r) AS rules WHERE none(x IN rules WHERE toString(x.Enabled) = "true") RETURN s, d;
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (r)
          WHERE (r:AccessRule OR r:AccessRuleV6)
          WITH CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END AS IPVersion, r.SourceZone AS SourceZone, r.DestZone AS DestZone,
               [x IN collect(r) WHERE toString(x.Enabled) = "true"] AS enabled
          WITH IPVersion, SourceZone, DestZone,
               reduce(last = null, x IN enabled |
                      CASE WHEN last IS NULL OR toInteger(x.Index) > toInteger(last.Index) THEN x ELSE last END) AS last
          WHERE last IS NULL
             OR last.SourceNet <> "Any" OR last.DestNet <> "Any" OR last.DestService <> "Any"
             OR coalesce(toString(last.Log), "0") <> "1"
          WITH IPVersion, SourceZone, DestZone, last ORDER BY IPVersion, SourceZone, DestZone
          WITH collect({v: IPVersion, s: SourceZone, d: DestZone, r: last}) AS rows
          WHERE size(rows) > 0
          RETURN "| IP Version | Source Zone | Destination Zone | Last Rule Index | Last Rule | Source | Destination | Service | Log |\n|---|---|---|---|---|---|---|---|---|\n" +
                 reduce(s = "", x IN rows | s + "| " + x.v + " | " + CASE WHEN x.s IS NULL THEN "(not set)" WHEN trim(toString(x.s)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.s), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.d IS NULL THEN "(not set)" WHEN trim(toString(x.d)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.d), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        CASE WHEN x.r IS NULL THEN "(no enabled rules) | | | | | " ELSE
                        coalesce(replace(toString(x.r.Index), "|", "\\|"), "(not set)") + " | " + CASE WHEN x.r.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(x.r.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.r.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.r.SourceNet IS NULL THEN "(not set)" WHEN trim(toString(x.r.SourceNet)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.r.SourceNet), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.r.DestNet IS NULL THEN "(not set)" WHEN trim(toString(x.r.DestNet)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.r.DestNet), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        CASE WHEN x.r.DestService IS NULL THEN "(not set)" WHEN trim(toString(x.r.DestService)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.r.DestService), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.r.Log IS NULL THEN "(not set)" WHEN trim(toString(x.r.Log)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.r.Log), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            SonicOS evaluates the access rules of each pair of source and destination zones as a chain, and traffic that matches no rule in the chain is dropped implicitly by the affected asset. This implicit drop is not logged. For each zone pair listed in the evidence, the enabled rule with the highest index, which is the final rule of the chain, is not a catch-all rule matching any source, any destination and any service with logging enabled, or the zone pair has no enabled rules at all. Connection attempts that fall through the chain are therefore discarded without any record. Scanning, attempts to reach unauthorised services, lateral movement between zones and policy violations leave no trace in the event log or at the syslog collector, which removes a primary source of evidence for detecting reconnaissance and investigating incidents, and prevents the organisation from identifying misconfigured applications that are being silently blocked.
          Plural: |-
            SonicOS evaluates the access rules of each pair of source and destination zones as a chain, and traffic that matches no rule in the chain is dropped implicitly by the affected assets. This implicit drop is not logged. For each zone pair listed in the evidence, the enabled rule with the highest index, which is the final rule of the chain, is not a catch-all rule matching any source, any destination and any service with logging enabled, or the zone pair has no enabled rules at all. Connection attempts that fall through the chain are therefore discarded without any record. Scanning, attempts to reach unauthorised services, lateral movement between zones and policy violations leave no trace in the event log or at the syslog collector, which removes a primary source of evidence for detecting reconnaissance and investigating incidents, and prevents the organisation from identifying misconfigured applications that are being silently blocked.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Policy**, then **Rules and Policies**, then **Access Rules**. For each zone pair listed in the evidence, add a rule as the final rule of the chain with the source set to `Any`, the destination set to `Any`, the service set to `Any` and logging enabled, so that the rule receives the highest index in the zone pair. Set the action of this rule to Deny so that the explicit rule mirrors the implicit drop. Apply the change separately to the Internet Protocol version 4 (IPv4) and Internet Protocol version 6 (IPv6) rule tables. After the change, generate a test connection that matches no other rule in the chain and confirm that it is both denied and recorded in the event log and at the organisation's syslog collector. Review the volume of logged denials after deployment and tune upstream rules where legitimate traffic is being denied.
          Plural: |-
