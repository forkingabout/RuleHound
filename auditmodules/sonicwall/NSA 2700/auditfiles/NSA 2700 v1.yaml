      - Name: "Log Categories With No Logging Destination"
        Audit: |-
          MATCH (c:ConfigTableRow {Table: "log"})
          WHERE coalesce(c.logCtgrSf, "0") = "0"
          RETURN c.logCtgrId AS logCtgrId, c.logCtgrSf AS logCtgrSf
          ORDER BY toInteger(logCtgrId);
        SoloSeverity: 5.3
        CumulativeSeverity: 2.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (c:ConfigTableRow {Table: "log"})
              WHERE coalesce(c.logCtgrSf, "0") = "0"
              WITH c ORDER BY toInteger(c.logCtgrId)
              WITH collect(c) AS cats
              WHERE size(cats) > 0
              RETURN "| logCtgrId | logCtgrSf |\n|---|---|\n" +
                     reduce(t = "", c IN cats | t + "| " + CASE WHEN c.logCtgrId IS NULL THEN "(not set)" WHEN trim(toString(c.logCtgrId)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(c.logCtgrId), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN c.logCtgrSf IS NULL THEN "(not set)" WHEN trim(toString(c.logCtgrSf)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(c.logCtgrSf), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                Each SonicOS log category carries a destination setting, stored in the configuration property `logCtgrSf`, that determines whether events in that category are written to the local event log, forwarded to syslog, sent by email, raised as Simple Network Management Protocol (SNMP) traps or exported through Internet Protocol Flow Information Export (IPFIX). A value of `0` means that no destination is enabled for any event in the category. On the affected asset, one or more log categories have a destination value of `0`, so every event in those categories is generated by the affected asset and then immediately discarded. Security relevant activity that falls into these categories therefore leaves no record anywhere, which prevents its detection by monitoring tools and removes any evidence that would support a later investigation.
              Plural: |-
                Each SonicOS log category carries a destination setting, stored in the configuration property `logCtgrSf`, that determines whether events in that category are written to the local event log, forwarded to syslog, sent by email, raised as Simple Network Management Protocol (SNMP) traps or exported through Internet Protocol Flow Information Export (IPFIX). A value of `0` means that no destination is enabled for any event in the category. On the affected assets, one or more log categories have a destination value of `0`, so every event in those categories is generated by the affected assets and then immediately discarded. Security relevant activity that falls into these categories therefore leaves no record anywhere, which prevents its detection by monitoring tools and removes any evidence that would support a later investigation.
