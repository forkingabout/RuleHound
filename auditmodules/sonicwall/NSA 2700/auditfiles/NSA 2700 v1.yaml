      - Name: "No SSL VPN Portal Login Message"
        Audit: |-
          OPTIONAL MATCH (a) WHERE a.loginmessage IS NOT NULL
          WITH collect(a.loginmessage)[0] AS loginmessage
          OPTIONAL MATCH (t) WHERE t.bannertitle IS NOT NULL
          WITH loginmessage, collect(t.bannertitle)[0] AS bannertitle
          WHERE coalesce(loginmessage, "") =~ "(?s)(\\s|<[^>]*>)*" AND trim(coalesce(bannertitle, "")) = ""
          RETURN bannertitle, loginmessage;
