                Review each zone listed in the evidence. Within the SonicOS management interface, navigate to **Object**, then **Match Objects**, then **Zones**, and delete each zone that is not required. For each zone that is required, navigate to **Policy**, then **Rules and Policies**, then **Access Rules**, and define rules that explicitly permit only the required traffic to and from the zone, ending each chain with a logged catch-all rule.
              Plural: |-
                Review each zone listed in the evidence. Within the SonicOS management interface, navigate to **Object**, then **Match Objects**, then **Zones**, and delete each zone that is not required. For each zone that is required, navigate to **Policy**, then **Rules and Policies**, then **Access Rules**, and define rules that explicitly permit only the required traffic to and from the zone, ending each chain with a logged catch-all rule.
