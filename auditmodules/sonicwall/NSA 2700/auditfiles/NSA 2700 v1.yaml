              WHERE p IS NULL OR toString(p.ComplexityRequired) <> "true"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| Password complexity | passwordComplexity | " + CASE WHEN p.passwordComplexity IS NULL THEN "(not set)" WHEN trim(toString(p.passwordComplexity)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(p.passwordComplexity), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Minimum uppercase characters | pwdUpperCaseNum | " + CASE WHEN p.pwdUpperCaseNum IS NULL THEN "(not set)" WHEN trim(toString(p.pwdUpperCaseNum)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(p.pwdUpperCaseNum), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Minimum lowercase characters | pwdLowerCaseNum | " + CASE WHEN p.pwdLowerCaseNum IS NULL THEN "(not set)" WHEN trim(toString(p.pwdLowerCaseNum)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(p.pwdLowerCaseNum), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Minimum numeric characters | pwdDigitalNum | " + CASE WHEN p.pwdDigitalNum IS NULL THEN "(not set)" WHEN trim(toString(p.pwdDigitalNum)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(p.pwdDigitalNum), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
