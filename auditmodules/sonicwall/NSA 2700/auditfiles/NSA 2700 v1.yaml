      - Name: "Weak Password Expiry Warning Policy Setting"
        Audit: |-
          OPTIONAL MATCH (p:PasswordPolicy)
          WITH p, [k IN coalesce(keys(p), []) WHERE toLower(k) CONTAINS "warn" | k] AS warningSettings
          WHERE size(warningSettings) = 0
          RETURN p.passwordUpdtPeriod AS passwordUpdtPeriod, warningSettings AS WarningSettings;
        SoloSeverity: 2.0
        CumulativeSeverity: 1.0
        Flag:
          - Message: "SonicOS has no password expiry warning setting; consider reporting this under Weak Password Age Policy Setting instead."
            Query: |-
              MATCH (p:PasswordPolicy) RETURN p.passwordUpdtPeriod AS passwordUpdtPeriod;
        Vars:
          - Name: "evidence"
            Query: |-
              OPTIONAL MATCH (p:PasswordPolicy)
              WITH p, [k IN coalesce(keys(p), []) WHERE toLower(k) CONTAINS "warn" | k] AS warningSettings
              WHERE size(warningSettings) = 0
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Password must be changed every (days) | passwordUpdtPeriod | " + CASE WHEN p.passwordUpdtPeriod IS NULL THEN "(not set)" WHEN trim(toString(p.passwordUpdtPeriod)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(p.passwordUpdtPeriod), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset provides no warning to users before their local account password expires, and SonicOS offers no setting to configure such a warning. Users therefore reach expiry without notice and may choose weak replacement passwords under time pressure, or may be locked out of administrative access at an inconvenient moment. When a password expires without warning, users are forced to choose a replacement immediately, often under pressure, which leads to predictable patterns such as incrementing a number at the end of the previous password. For administrators, an unexpected expiry can also interrupt urgent operational work at the network perimeter.
              Plural: |-
                The affected assets provide no warning to users before their local account password expires, and SonicOS offers no setting to configure such a warning. Users therefore reach expiry without notice and may choose weak replacement passwords under time pressure, or may be locked out of administrative access at an inconvenient moment. When a password expires without warning, users are forced to choose a replacement immediately, often under pressure, which leads to predictable patterns such as incrementing a number at the end of the previous password. For administrators, an unexpected expiry can also interrupt urgent operational work at the network perimeter.
