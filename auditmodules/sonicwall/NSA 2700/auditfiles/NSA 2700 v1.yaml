    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset retains the disabled access rules listed in the evidence. Disabled rules make the effective policy harder to review and understand, and they preserve access paths that the organisation previously decided to withdraw. Re-enabling a disabled rule, whether by mistake during maintenance or deliberately by an attacker with administrative access, immediately restores that access without creating a new rule that change control processes or rule reviews would be likely to notice. A large number of disabled rules also indicates that rule changes are not being cleaned up after use, which over time makes the rule base difficult to understand and increases the likelihood of configuration errors.
          Plural: |-
