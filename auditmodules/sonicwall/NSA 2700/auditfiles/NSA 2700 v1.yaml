      - Name: "Strict TCP Compliance Not Enforced"
        Audit: |-
          MATCH (s)
          WHERE s.strictTcpStateful IS NOT NULL AND s.strictTcpStateful <> "on"
          RETURN s.strictTcpStateful AS strictTcpStateful;
        SoloSeverity: 2.0
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.strictTcpStateful IS NOT NULL AND s.strictTcpStateful <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Enforce strict TCP compliance | strictTcpStateful | " + CASE WHEN s.strictTcpStateful IS NULL THEN "(not set)" WHEN trim(toString(s.strictTcpStateful)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.strictTcpStateful), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset does not enforce strict Transmission Control Protocol (TCP) compliance with Request for Comments (RFC) 793 and Request for Comments (RFC) 1122, because the configuration property `strictTcpStateful` is set to `off`. Malformed and out-of-state Transmission Control Protocol (TCP) segments, which are used to evade security controls, operating system fingerprinting and certain scanning techniques, are therefore processed instead of being dropped. Specially crafted segments with unusual flag combinations, invalid sequence numbers or overlapping data can be used to confuse inspection engines, so that the affected asset and the destination host interpret the same traffic differently. Strict enforcement ensures that only well-formed traffic is processed, which reduces the attack surface of both the affected asset and the hosts behind it.
