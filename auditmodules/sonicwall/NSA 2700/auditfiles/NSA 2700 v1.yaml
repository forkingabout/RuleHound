    GlobalVars: []
    Subs:
      - Name: "Default Or Common Community String"
        Audit: |-
          WITH ["public", "private", "community", "snmp", "admin", "default", "secret", "sonicwall"] AS common, 12 AS minLength
          MATCH (s:SNMPSettings)
          UNWIND [{setting: "Read community", property: "snmp_GetCommunity", value: s.snmp_GetCommunity},
                  {setting: "Trap community", property: "snmp_TrapCommunity", value: s.snmp_TrapCommunity}] AS c
          WITH common, minLength, c
          WHERE trim(coalesce(c.value, "")) <> "" AND toLower(c.value) IN common
          RETURN c.property AS Property, c.value AS Value;
        SoloSeverity: 7.5
        CumulativeSeverity: 3.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              WITH ["public", "private", "community", "snmp", "admin", "default", "secret", "sonicwall"] AS common, 12 AS minLength
              MATCH (s:SNMPSettings)
              UNWIND [{setting: "Read community", property: "snmp_GetCommunity", value: s.snmp_GetCommunity},
                      {setting: "Trap community", property: "snmp_TrapCommunity", value: s.snmp_TrapCommunity}] AS c
              WITH common, minLength, c
              WHERE trim(coalesce(c.value, "")) <> "" AND toLower(c.value) IN common
              WITH collect(c) AS rows
              WHERE size(rows) > 0
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + reduce(s = "", c IN rows | s + "| " + c.setting + " | " + c.property + " | " + CASE WHEN c.value IS NULL THEN "(not set)" WHEN trim(toString(c.value)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(c.value), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset uses a default or commonly used Simple Network Management Protocol (SNMP) community string. Every Simple Network Management Protocol (SNMP) scanning tool tries values such as public, private and the vendor's name first, so any host that can reach the agent can read device information immediately and without effort. A default or common community string is equivalent to having no authentication on the Simple Network Management Protocol (SNMP) agent. The information returned includes the interface configuration, routing table, address resolution table and system details, which together give an attacker an accurate map of the network and of the devices behind the affected asset.
