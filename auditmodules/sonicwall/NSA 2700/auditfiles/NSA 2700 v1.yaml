                AND NOT (z.PolicyPageEnable = "1" AND trim(coalesce(z.PolicyPageText, "")) <> "")
              WITH z ORDER BY z.ObjectName
              WITH collect(z) AS zones
              WHERE size(zones) > 0
              RETURN "| Zone | EnableGuestServices | PolicyPageEnable | PolicyPageText |\n|---|---|---|---|\n" +
                     reduce(s = "", z IN zones | s + "| " + coalesce(replace(toString(z.ObjectName), "|", "\\|"), "(not set)") + " | " + CASE WHEN z.EnableGuestServices IS NULL THEN "(not set)" WHEN trim(toString(z.EnableGuestServices)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.EnableGuestServices), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
