  - Name: "Rules Allow Access To Plaintext Services"
    Severity: 6.5
    Audit: |-
      WITH [{port: "20", protocol: "TCP", name: "FTP data"}, {port: "21", protocol: "TCP", name: "FTP"},
            {port: "23", protocol: "TCP", name: "Telnet"}, {port: "25", protocol: "TCP", name: "SMTP"},
            {port: "69", protocol: "UDP", name: "TFTP"}, {port: "80", protocol: "TCP", name: "HTTP"},
            {port: "110", protocol: "TCP", name: "POP3"}, {port: "119", protocol: "TCP", name: "NNTP"},
            {port: "143", protocol: "TCP", name: "IMAP"}, {port: "161", protocol: "UDP", name: "SNMP"},
            {port: "162", protocol: "UDP", name: "SNMP trap"}, {port: "389", protocol: "TCP", name: "LDAP"},
            {port: "389", protocol: "UDP", name: "CLDAP"}, {port: "512", protocol: "TCP", name: "rexec"},
            {port: "513", protocol: "TCP", name: "rlogin"}, {port: "514", protocol: "TCP", name: "rsh"},
            {port: "514", protocol: "UDP", name: "Syslog"}, {port: "1883", protocol: "TCP", name: "MQTT"},
            {port: "5900", protocol: "TCP", name: "VNC"}, {port: "8080", protocol: "TCP", name: "HTTP alternate"}] AS plaintext
      MATCH (svc:Service)
      WHERE any(pt IN plaintext WHERE pt.protocol = svc.ProtocolName AND (svc.Port1 = pt.port OR svc.Port2 = pt.port))
      MATCH p = (r)-->(first)<-[*0..]-(svc)
      WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true" AND r.ActionName = "Allow"
        AND all(n IN nodes(p)[1..-1] WHERE n:ServiceGroup)
      WITH DISTINCT r, svc
      RETURN CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END AS IPVersion, r.Priority AS Priority, r.ObjectName AS Rule, svc.ObjectName AS Service,
             svc.ProtocolName AS Protocol, svc.Port1 AS Port1, svc.Port2 AS Port2
      ORDER BY IPVersion, toInteger(Priority), Service;
    Flag:
      - Message: "Results include SonicOS-generated management rules (HTTP Management, HTTP Redirect Page Serving); separate them from administrator-created rules when reporting."
