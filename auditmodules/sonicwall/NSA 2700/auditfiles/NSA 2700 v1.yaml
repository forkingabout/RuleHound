  - Name: "Message Logging Not Enabled"
    Severity: 5.3
    CumulativeRisk: false
    Intro:
      Singular: |-
        The affected asset does not reliably record or retain security events. SonicOS decides whether an event is written anywhere through the global logging level, the destination settings of each log category and each individual event, and the log storage setting. The following logging controls on the affected asset were found to be misconfigured. The following issues were identified:
      Plural: |-
        The affected assets do not reliably record or retain security events. SonicOS decides whether an event is written anywhere through the global logging level, the destination settings of each log category and each individual event, and the log storage setting. The following logging controls on the affected assets were found to be misconfigured. The following issues were identified:
    GlobalVars: []
    Subs:
      - Name: "Global Logging Level Below Informational"
        Audit: |-
          WITH 6 AS minLevel
          MATCH (l:LoggingSettings)
          WHERE toInteger(l.logPrefs_glbPrio) IS NULL OR toInteger(l.logPrefs_glbPrio) < minLevel
          RETURN l.logPrefs_glbPrio AS logPrefs_glbPrio;
        SoloSeverity: 5.3
        CumulativeSeverity: 2.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              WITH 6 AS minLevel
              MATCH (l:LoggingSettings)
              WHERE toInteger(l.logPrefs_glbPrio) IS NULL OR toInteger(l.logPrefs_glbPrio) < minLevel
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Global logging level | logPrefs_glbPrio | " + CASE WHEN l.logPrefs_glbPrio IS NULL THEN "(not set)" WHEN trim(toString(l.logPrefs_glbPrio)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.logPrefs_glbPrio), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                SonicOS discards every event that is less severe than the global logging level held in the configuration property `logPrefs_glbPrio` before the event is passed to any destination. On the affected asset this property is set below the Informational level, which is level 6. As a result, events recorded at the Notice, Informational and Debug levels are never written to the local event log, never forwarded to a syslog server and never included in email reports. These levels include the records of permitted and denied connections, administrator and user login activity, virtual private network (VPN) negotiation messages and notifications of configuration changes. Without these records, the organisation cannot reconstruct the actions of an attacker, cannot detect reconnaissance or brute force activity against the affected asset, and cannot demonstrate who changed the security policy and when. The absence of this audit trail materially reduces the ability to detect, investigate and respond to a security incident affecting the network perimeter.
