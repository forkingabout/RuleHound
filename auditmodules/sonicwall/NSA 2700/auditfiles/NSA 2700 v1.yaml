  - Name: "Weak Password Policy Settings"
    Severity: 6.5
    CumulativeRisk: false
    Intro:
      Singular: |-
        The password policy of the affected asset, which governs every local administrator and user account, was found to accept weak passwords. Weak local passwords are vulnerable to online guessing against the management and user login interfaces and to offline cracking of password hashes obtained from a configuration export, and a successful attack against the administrator account gives full control of the network perimeter. Every change below should be applied to all classes of administrator and user account, and existing local accounts should be required to change their passwords so that the strengthened policy takes effect. The following issues were identified:
      Plural: |-
        The password policy of the affected assets, which governs every local administrator and user account, was found to accept weak passwords. Weak local passwords are vulnerable to online guessing against the management and user login interfaces and to offline cracking of password hashes obtained from a configuration export, and a successful attack against the administrator account gives full control of the network perimeter. Every change below should be applied to all classes of administrator and user account, and existing local accounts should be required to change their passwords so that the strengthened policy takes effect. The following issues were identified:
    GlobalVars: []
    Subs:
      - Name: "Weak Lowercase Password Character Policy Setting"
        Audit: |-
          WITH 1 AS required
          OPTIONAL MATCH (p:PasswordPolicy)
          WITH required, p
          WHERE p IS NULL OR toInteger(coalesce(p.MinLowercase, 0)) < required
          RETURN p.pwdLowerCaseNum AS pwdLowerCaseNum;
        SoloSeverity: 3.7
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              WITH 1 AS required
              OPTIONAL MATCH (p:PasswordPolicy)
              WITH required, p
              WHERE p IS NULL OR toInteger(coalesce(p.MinLowercase, 0)) < required
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Minimum lowercase characters | pwdLowerCaseNum | " + CASE WHEN p.pwdLowerCaseNum IS NULL THEN "(not set)" WHEN trim(toString(p.pwdLowerCaseNum)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(p.pwdLowerCaseNum), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset requires no lower case characters in the passwords of local administrator and user accounts, because the configuration property `pwdLowerCaseNum` is set to `0`. Passwords that consist entirely of upper case letters, digits or symbols therefore remain acceptable, which reduces the number of possible passwords an attacker must try. Weak local passwords are vulnerable to online guessing against the management and user login interfaces, and to offline cracking if a configuration export containing password hashes is obtained. Character class requirements work together with minimum length to make passwords resistant to guessing.
              Plural: |-
                The affected assets require no lower case characters in the passwords of local administrator and user accounts, because the configuration property `pwdLowerCaseNum` is set to `0`. Passwords that consist entirely of upper case letters, digits or symbols therefore remain acceptable, which reduces the number of possible passwords an attacker must try. Weak local passwords are vulnerable to online guessing against the management and user login interfaces, and to offline cracking if a configuration export containing password hashes is obtained. Character class requirements work together with minimum length to make passwords resistant to guessing.
            BatchText:
              Singular: |-
                No lower case characters are required, because the configuration property `pwdLowerCaseNum` is set to `0`, so passwords without lower case letters are accepted.
              Plural: |-
                No lower case characters are required, because the configuration property `pwdLowerCaseNum` is set to `0`, so passwords without lower case letters are accepted.
          - Name: "Evidence"
            SoloText:
              Singular: |-
                The following values were extracted from the configuration of the affected asset:

                {evidence}
              Plural: |-
                The following values were extracted from the configuration of the affected assets:

                {evidence}
            BatchText:
              Singular: |-
                {evidence}
              Plural: |-
                {evidence}
