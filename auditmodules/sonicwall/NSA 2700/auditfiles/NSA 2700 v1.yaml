                The affected assets do not enforce strict Transmission Control Protocol (TCP) compliance with Request for Comments (RFC) 793 and Request for Comments (RFC) 1122, because the configuration property `strictTcpStateful` is set to `off`. Malformed and out-of-state Transmission Control Protocol (TCP) segments, which are used to evade security controls, operating system fingerprinting and certain scanning techniques, are therefore processed instead of being dropped. Specially crafted segments with unusual flag combinations, invalid sequence numbers or overlapping data can be used to confuse inspection engines, so that the affected assets and the destination host interpret the same traffic differently. Strict enforcement ensures that only well-formed traffic is processed, which reduces the attack surface of both the affected assets and the hosts behind it.
