              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| SSL VPN portal banner title | bannertitle | " + CASE WHEN bannertitle IS NULL THEN "(not set)" WHEN trim(toString(bannertitle)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(bannertitle), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
