  - Name: "Clear Text Telnet Service Enabled"
    Severity: 7.5
    Audit: |-
      MATCH (n)
      WHERE n:Interface OR n:AdministrationSettings OR n:SystemSettings
      UNWIND [k IN keys(n) WHERE toLower(k) CONTAINS "telnet" AND toString(n[k]) IN ["1", "on", "true"]] AS k
      RETURN labels(n)[0] AS ObjectType, n.ObjectName AS Object, k AS Property, n[k] AS Value;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (n)
          WHERE n:Interface OR n:AdministrationSettings OR n:SystemSettings
          UNWIND [k IN keys(n) WHERE toLower(k) CONTAINS "telnet" AND toString(n[k]) IN ["1", "on", "true"]] AS k
          WITH n, k ORDER BY n.ObjectName, k
          WITH collect({n: n, k: k}) AS rows
          WHERE size(rows) > 0
          RETURN "| Object Type | Object | Property | Value |\n|---|---|---|---|\n" +
                 reduce(s = "", r IN rows | s + "| " + labels(r.n)[0] + " | " + coalesce(replace(toString(r.n.ObjectName), "|", "\\|"), "(not set)") + " | " + r.k + " | " + CASE WHEN r.n[r.k] IS NULL THEN "(not set)" WHEN trim(toString(r.n[r.k])) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.n[r.k]), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset accepts Telnet management connections. Telnet transmits the administrator username, the password and every command and response in clear text. Any host on the network path between the administrator and the affected asset can capture these credentials and use them to take full control of the configuration of the affected asset. Network traffic can be intercepted on shared network segments, on compromised switches or routers, and through address resolution spoofing attacks on the local network. Any administrative session conducted over Telnet therefore exposes the credentials that control the entire network perimeter, and also allows an attacker positioned on the path to inject commands into the session.
          Plural: |-
            The affected assets accept Telnet management connections. Telnet transmits the administrator username, the password and every command and response in clear text. Any host on the network path between the administrator and the affected assets can capture these credentials and use them to take full control of the configuration of the affected assets. Network traffic can be intercepted on shared network segments, on compromised switches or routers, and through address resolution spoofing attacks on the local network. Any administrative session conducted over Telnet therefore exposes the credentials that control the entire network perimeter, and also allows an attacker positioned on the path to inject commands into the session.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Disable Telnet management on every interface of the affected asset. Use Secure Shell (SSH) for command line administration, restricted to an address group containing only the workstations or jump hosts used by administrators, and confirm after the change that Transmission Control Protocol (TCP) port 23 no longer accepts connections on any interface. Confirm that every administrator has a working Secure Shell (SSH) client and that the Secure Shell (SSH) host key of the affected asset has been verified and recorded, so that administrators can detect interception attempts. Include the absence of Telnet in the organisation's hardening baseline for network perimeter devices.
          Plural: |-
            Disable Telnet management on every interface of the affected assets. Use Secure Shell (SSH) for command line administration, restricted to an address group containing only the workstations or jump hosts used by administrators, and confirm after the change that Transmission Control Protocol (TCP) port 23 no longer accepts connections on any interface. Confirm that every administrator has a working Secure Shell (SSH) client and that the Secure Shell (SSH) host keys of the affected assets have been verified and recorded, so that administrators can detect interception attempts. Include the absence of Telnet in the organisation's hardening baseline for network perimeter devices.
  - Name: "No SNMP TFTP Server Access List Configured"
    Severity: 5.3
    Audit: |-
      MATCH (s:SNMPSettings) WHERE s.snmp_Enable = "on"
      MATCH (i:Interface)
      WHERE (i.snmp_mgmt = "1" AND trim(coalesce(i.snmp_mgmt_src_addr, "")) = "")
         OR (i.snmp6_mgmt = "1" AND trim(coalesce(i.snmp_mgmt6_src_addr, "")) = "")
      RETURN i.ObjectName AS Interface, i.Zone AS Zone, i.IPAddress AS IPAddress, i.snmp_mgmt AS snmp_mgmt, i.snmp_mgmt_src_addr AS snmp_mgmt_src_addr,
             i.snmp6_mgmt AS snmp6_mgmt, i.snmp_mgmt6_src_addr AS snmp_mgmt6_src_addr
      ORDER BY Interface;
    Flag:
      - Message: "At least one affected interface belongs to an untrusted (WAN, ZoneType 0) zone: the exposure is reachable from the internet unless upstream filtering blocks it."
        Query: |-
          MATCH (z:Zone {ZoneType: "0"})-[:HasInterface]->(i:Interface)
          WHERE (i.https_mgmt = "1" AND trim(coalesce(i.https_mgmt_src_addr, "")) = "")
             OR (i.http_mgmt = "1" AND trim(coalesce(i.http_mgmt_src_addr, "")) = "")
             OR (i.ssh_mgmt = "1" AND trim(coalesce(i.ssh_mgmt_src_addr, "")) = "")
             OR (i.snmp_mgmt = "1" AND trim(coalesce(i.snmp_mgmt_src_addr, "")) = "")
          RETURN i.ObjectName AS Interface;
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (s:SNMPSettings) WHERE s.snmp_Enable = "on"
          MATCH (i:Interface)
          WHERE (i.snmp_mgmt = "1" AND trim(coalesce(i.snmp_mgmt_src_addr, "")) = "")
             OR (i.snmp6_mgmt = "1" AND trim(coalesce(i.snmp_mgmt6_src_addr, "")) = "")
          WITH i ORDER BY i.ObjectName
          WITH collect(i) AS ifaces
          WHERE size(ifaces) > 0
          RETURN "| Interface | Zone | IP Address | snmp_mgmt | snmp_mgmt_src_addr | snmp6_mgmt | snmp_mgmt6_src_addr |\n|---|---|---|---|---|---|---|\n" +
                 reduce(s = "", i IN ifaces | s + "| " + coalesce(replace(toString(i.ObjectName), "|", "\\|"), "(not set)") + " | " + CASE WHEN i.Zone IS NULL THEN "(not set)" WHEN trim(toString(i.Zone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.Zone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN i.IPAddress IS NULL THEN "(not set)" WHEN trim(toString(i.IPAddress)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.IPAddress), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        CASE WHEN i.snmp_mgmt IS NULL THEN "(not set)" WHEN trim(toString(i.snmp_mgmt)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.snmp_mgmt), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN i.snmp_mgmt_src_addr IS NULL THEN "(not set)" WHEN trim(toString(i.snmp_mgmt_src_addr)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.snmp_mgmt_src_addr), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN i.snmp6_mgmt IS NULL THEN "(not set)" WHEN trim(toString(i.snmp6_mgmt)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.snmp6_mgmt), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN i.snmp_mgmt6_src_addr IS NULL THEN "(not set)" WHEN trim(toString(i.snmp_mgmt6_src_addr)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.snmp_mgmt6_src_addr), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset answers Simple Network Management Protocol (SNMP) requests on the interfaces listed in the evidence without any source address restriction, while the Simple Network Management Protocol (SNMP) agent is enabled. Any host that can reach these interfaces can query the agent using the community string and retrieve interface, routing, address resolution and system information that describes the internal network in detail. Combined with a weak community string, this information supports reconnaissance and the planning of further attacks. SonicOS does not provide a Trivial File Transfer Protocol (TFTP) server, so the Simple Network Management Protocol (SNMP) is the only service in scope for this finding.
          Plural: |-
            The affected assets answer Simple Network Management Protocol (SNMP) requests on the interfaces listed in the evidence without any source address restriction, while the Simple Network Management Protocol (SNMP) agent is enabled. Any host that can reach these interfaces can query the agent using the community string and retrieve interface, routing, address resolution and system information that describes the internal network in detail. Combined with a weak community string, this information supports reconnaissance and the planning of further attacks. SonicOS does not provide a Trivial File Transfer Protocol (TFTP) server, so the Simple Network Management Protocol (SNMP) is the only service in scope for this finding.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Network**, then **System**, then **Interfaces**, and disable Simple Network Management Protocol (SNMP) management on every interface that does not need to serve the organisation's monitoring platform, and on every interface in an internet-facing zone. On the interfaces that remain, restrict Simple Network Management Protocol (SNMP) access to an address object containing only the monitoring servers. Confirm after the change that the agent does not respond to requests from any other address.
          Plural: |-
            Within the SonicOS management interface, navigate to **Network**, then **System**, then **Interfaces**, and disable Simple Network Management Protocol (SNMP) management on every interface that does not need to serve the organisation's monitoring platform, and on every interface in an internet-facing zone. On the interfaces that remain, restrict Simple Network Management Protocol (SNMP) access to an address object containing only the monitoring servers. Confirm after the change that the agent does not respond to requests from any other address.
  - Name: "No Time Synchronization Configured"
    Severity: 3.1
    Audit: |-
      OPTIONAL MATCH (t:TimeSettings)
      WITH t
      WHERE t IS NULL OR coalesce(t.ntp_useNtp, "off") <> "on"
      RETURN t.ntp_useNtp AS ntp_useNtp;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          OPTIONAL MATCH (t:TimeSettings)
          WITH t
          WHERE t IS NULL OR coalesce(t.ntp_useNtp, "off") <> "on"
          RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                 "| Use NTP | ntp_useNtp | " + CASE WHEN t.ntp_useNtp IS NULL THEN "(not set)" WHEN trim(toString(t.ntp_useNtp)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(t.ntp_useNtp), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                 "| Only use custom NTP servers | ntp_onlyUseCustomServer | " + CASE WHEN t.ntp_onlyUseCustomServer IS NULL THEN "(not set)" WHEN trim(toString(t.ntp_onlyUseCustomServer)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(t.ntp_onlyUseCustomServer), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                 "| NTP update interval | ntp_updateInterval | " + CASE WHEN t.ntp_updateInterval IS NULL THEN "(not set)" WHEN trim(toString(t.ntp_updateInterval)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(t.ntp_updateInterval), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset maintains time using its local clock only, because the configuration property `ntp_useNtp` is not enabled. The local clock drifts over time, so event timestamps on the affected asset will disagree with those of other systems. This undermines the correlation of events from the affected asset with server, endpoint and directory events during an investigation, and can cause certificate validity periods and time-based rule schedules to be evaluated incorrectly. Accurate and consistent time is a prerequisite for reliable incident investigation, because events from different systems must be placed in a single timeline to understand how an attack unfolded.
          Plural: |-
            The affected assets maintain time using its local clock only, because the configuration property `ntp_useNtp` is not enabled. The local clock drifts over time, so event timestamps on the affected assets will disagree with those of other systems. This undermines the correlation of events from the affected assets with server, endpoint and directory events during an investigation, and can cause certificate validity periods and time-based rule schedules to be evaluated incorrectly. Accurate and consistent time is a prerequisite for reliable incident investigation, because events from different systems must be placed in a single timeline to understand how an attack unfolded.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Time**, enable the use of the Network Time Protocol (NTP), and configure at least two internal or trusted Network Time Protocol (NTP) servers. Confirm after the change that the clock of the affected asset matches the organisation's reference time source. Use the same time sources as the organisation's servers and domain controllers, and monitor the synchronisation status so that a loss of synchronisation is detected and corrected promptly.
          Plural: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Time**, enable the use of the Network Time Protocol (NTP), and configure at least two internal or trusted Network Time Protocol (NTP) servers. Confirm after the change that the clock of the affected assets matches the organisation's reference time source. Use the same time sources as the organisation's servers and domain controllers, and monitor the synchronisation status so that a loss of synchronisation is detected and corrected promptly.
  - Name: "Security Services Not Enforced On All Zones"
    Severity: 6.5
    Audit: |-
      MATCH (z:Zone)-[:HasInterface]->(:Interface)
      WITH DISTINCT z
      WHERE any(k IN ["GavProfile", "MyIDPProfile", "ASProfile", "ACProfile"] WHERE coalesce(z[k], "0") <> "1")
      RETURN z.ObjectName AS Zone, z.GavProfile AS GavProfile, z.MyIDPProfile AS MyIDPProfile, z.ASProfile AS ASProfile, z.ACProfile AS ACProfile
      ORDER BY Zone;
    Flag:
      - Message: "Confirm which traffic flows remain uninspected: flows between a listed zone and a zone with services enabled are inspected by the enabled zone."
        Query: |-
          MATCH (z:Zone) WHERE z.GavProfile = "1" RETURN z.ObjectName AS Zone;
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (z:Zone)-[:HasInterface]->(:Interface)
          WITH DISTINCT z
          WHERE any(k IN ["GavProfile", "MyIDPProfile", "ASProfile", "ACProfile"] WHERE coalesce(z[k], "0") <> "1")
          WITH z ORDER BY z.ObjectName
          WITH collect(z) AS zones
          WHERE size(zones) > 0
          RETURN "| Zone | ZoneType | GavProfile | MyIDPProfile | ASProfile | ACProfile | DPISSLCProfile | DPISSLSProfile |\n|---|---|---|---|---|---|---|---|\n" +
                 reduce(s = "", z IN zones | s + "| " + coalesce(replace(toString(z.ObjectName), "|", "\\|"), "(not set)") + " | " + CASE WHEN z.ZoneType IS NULL THEN "(not set)" WHEN trim(toString(z.ZoneType)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.ZoneType), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN z.GavProfile IS NULL THEN "(not set)" WHEN trim(toString(z.GavProfile)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.GavProfile), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        CASE WHEN z.MyIDPProfile IS NULL THEN "(not set)" WHEN trim(toString(z.MyIDPProfile)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.MyIDPProfile), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN z.ASProfile IS NULL THEN "(not set)" WHEN trim(toString(z.ASProfile)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.ASProfile), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN z.ACProfile IS NULL THEN "(not set)" WHEN trim(toString(z.ACProfile)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.ACProfile), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN z.DPISSLCProfile IS NULL THEN "(not set)" WHEN trim(toString(z.DPISSLCProfile)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.DPISSLCProfile), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        CASE WHEN z.DPISSLSProfile IS NULL THEN "(not set)" WHEN trim(toString(z.DPISSLSProfile)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(z.DPISSLSProfile), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            SonicOS applies the Gateway Anti-Virus, Intrusion Prevention, Anti-Spyware and Application Control services to the traffic of a zone only when the corresponding zone settings, held in the configuration properties `GavProfile`, `MyIDPProfile`, ASProfile and ACProfile, are enabled. On the affected asset, these services are disabled on the zones listed in the evidence, all of which contain active interfaces. Malware, exploit attempts and command and control traffic that move within or between these zones therefore pass without inspection, even though the services are licensed and enabled globally. This removes the ability of the affected asset to detect and block lateral movement inside the network.
          Plural: |-
            SonicOS applies the Gateway Anti-Virus, Intrusion Prevention, Anti-Spyware and Application Control services to the traffic of a zone only when the corresponding zone settings, held in the configuration properties `GavProfile`, `MyIDPProfile`, ASProfile and ACProfile, are enabled. On the affected assets, these services are disabled on the zones listed in the evidence, all of which contain active interfaces. Malware, exploit attempts and command and control traffic that move within or between these zones therefore pass without inspection, even though the services are licensed and enabled globally. This removes the ability of the affected assets to detect and block lateral movement inside the network.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Object**, then **Match Objects**, then **Zones**, edit each zone listed in the evidence, and enable Gateway Anti-Virus, Intrusion Prevention, Anti-Spyware and Application Control. For zones whose users browse the internet, also enable client inspection of Secure Sockets Layer (SSL) traffic. Monitor the processing load of the affected asset after the change and confirm through the security services logs that traffic in the corrected zones is now being inspected.
          Plural: |-
            Within the SonicOS management interface, navigate to **Object**, then **Match Objects**, then **Zones**, edit each zone listed in the evidence, and enable Gateway Anti-Virus, Intrusion Prevention, Anti-Spyware and Application Control. For zones whose users browse the internet, also enable client inspection of Secure Sockets Layer (SSL) traffic. Monitor the processing load of the affected assets after the change and confirm through the security services logs that traffic in the corrected zones is now being inspected.
  - Name: "Multi-Factor Authentication Not Enforced For Administrator"
    Severity: 7.4
    Audit: |-
      MATCH (a:AdministratorAccount)
      WHERE coalesce(a.adminOtpReq, "0") IN ["0", ""] AND coalesce(a.adminLoginOtpRequire, "0") IN ["0", ""]
      RETURN a.adminOtpReq AS adminOtpReq, a.adminLoginOtpRequire AS adminLoginOtpRequire, a.adminObjTotpBindState AS adminObjTotpBindState;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (a:AdministratorAccount)
          WHERE coalesce(a.adminOtpReq, "0") IN ["0", ""] AND coalesce(a.adminLoginOtpRequire, "0") IN ["0", ""]
          RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                 "| Administrator one-time password method | adminOtpReq | " + CASE WHEN a.adminOtpReq IS NULL THEN "(not set)" WHEN trim(toString(a.adminOtpReq)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.adminOtpReq), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                 "| Require one-time password at administrator login | adminLoginOtpRequire | " + CASE WHEN a.adminLoginOtpRequire IS NULL THEN "(not set)" WHEN trim(toString(a.adminLoginOtpRequire)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.adminLoginOtpRequire), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                 "| Administrator TOTP key bound | adminObjTotpBindState | " + CASE WHEN a.adminObjTotpBindState IS NULL THEN "(not set)" WHEN trim(toString(a.adminObjTotpBindState)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.adminObjTotpBindState), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset authenticates the built-in administrator account with a password alone. The configuration properties `adminOtpReq` and `adminLoginOtpRequire` are both set to `0`, and no time-based one-time password (TOTP) key has been bound to the account. A single phished, reused, guessed or cracked password therefore grants full control of the configuration of the affected asset, including the ability to disable security services, open access to the internal network and create additional administrator accounts. Network perimeter devices are a priority target for attackers, and credential-based attacks against their management interfaces are common.
          Plural: |-
            The affected assets authenticate the built-in administrator account with a password alone. The configuration properties `adminOtpReq` and `adminLoginOtpRequire` are both set to `0`, and no time-based one-time password (TOTP) key has been bound to the account. A single phished, reused, guessed or cracked password therefore grants full control of the configuration of the affected assets, including the ability to disable security services, open access to the internal network and create additional administrator accounts. Network perimeter devices are a priority target for attackers, and credential-based attacks against their management interfaces are common.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration**, set the one-time password (OTP) method for the administrator account to time-based one-time password (TOTP), bind an authenticator application to the account, and require a one-time password (OTP) at every administrator login. Apply the same requirement to every other administrator account, and store the emergency scratch codes securely. Confirm through the authentication logs that a one-time password (OTP) is required at every administrator login, and include multi-factor authentication (MFA) for administrators in the organisation's hardening baseline for network perimeter devices.
          Plural: |-
            Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **Administration**, set the one-time password (OTP) method for the administrator account to time-based one-time password (TOTP), bind an authenticator application to the account, and require a one-time password (OTP) at every administrator login. Apply the same requirement to every other administrator account, and store the emergency scratch codes securely. Confirm through the authentication logs that a one-time password (OTP) is required at every administrator login, and include multi-factor authentication (MFA) for administrators in the organisation's hardening baseline for network perimeter devices.
  - Name: "Multi-Factor Authentication Not Enforced For Users"
    Severity: 5.4
    Audit: |-
      MATCH (u:User)
      WHERE coalesce(u.OtpReq, "0") IN ["0", ""]
      RETURN u.ObjectName AS User, u.OtpReq AS OtpReq
      ORDER BY User;
    Flag:
