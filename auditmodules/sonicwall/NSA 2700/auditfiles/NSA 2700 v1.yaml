          RETURN "| IP Version | Priority | Source Zone | Destination Zone | Rule | Rule Service | Service Object | Protocol | Port1 | Port2 |\n|---|---|---|---|---|---|---|---|---|---|\n" +
                 reduce(s = "", x IN rows | s + "| " + CASE WHEN x.r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END + " | " + coalesce(replace(toString(x.r.Priority), "|", "\\|"), "(not set)") + " | " +
