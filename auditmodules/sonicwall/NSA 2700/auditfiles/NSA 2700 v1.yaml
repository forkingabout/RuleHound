      - Name: "Addresses Unrestricted By Access Rules"
        Audit: |-
          OPTIONAL MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6)
          WITH [x IN collect(DISTINCT r.SourceZone) + collect(DISTINCT r.DestZone) WHERE trim(coalesce(x, "")) <> ""] AS usedZones,
               collect(DISTINCT r.SourceNet) + collect(DISTINCT r.DestNet) AS usedNets
          MATCH (g:AddressGroup) WHERE (trim(coalesce(g.Zone, "")) = "" OR NOT g.Zone IN usedZones)
            AND NOT g.ObjectName IN usedNets
            AND NOT exists { MATCH (g)-[:InAddressGroup*1..10]->(m:AddressGroup)
                             WHERE m.ObjectName IN usedNets OR (trim(coalesce(m.Zone, "")) <> "" AND m.Zone IN usedZones) }
          RETURN "AddressGroup" AS ObjectType, g.ObjectName AS Name, g.Zone AS Zone
          UNION ALL
          OPTIONAL MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6)
          WITH [x IN collect(DISTINCT r.SourceZone) + collect(DISTINCT r.DestZone) WHERE trim(coalesce(x, "")) <> ""] AS usedZones,
               collect(DISTINCT r.SourceNet) + collect(DISTINCT r.DestNet) AS usedNets
          MATCH (a:IPAddress) WHERE (trim(coalesce(a.Zone, "")) = "" OR NOT a.Zone IN usedZones)
            AND NOT a.ObjectName IN usedNets
            AND NOT exists { MATCH (a)-[:InAddressGroup*1..10]->(m:AddressGroup)
                             WHERE m.ObjectName IN usedNets OR (trim(coalesce(m.Zone, "")) <> "" AND m.Zone IN usedZones) }
          RETURN "IPAddress" AS ObjectType, a.ObjectName AS Name, a.Zone AS Zone;
        SoloSeverity: 2.0
        CumulativeSeverity: 1.0
        Flag:
          - Message: "Results include objects created by SonicOS rather than by an administrator; addrObjProperties or svcObjProperties other than 14 identifies a built-in object."
            Query: |-
              MATCH (n) WHERE (n:AddressGroup OR n:IPAddress OR n:ServiceGroup OR n:Service) AND coalesce(n.addrObjProperties, n.svcObjProperties, "14") <> "14" RETURN count(n) AS BuiltIn;
        Vars:
          - Name: "evidence"
            Query: |-
              OPTIONAL MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6)
              WITH [x IN collect(DISTINCT r.SourceZone) + collect(DISTINCT r.DestZone) WHERE trim(coalesce(x, "")) <> ""] AS usedZones,
                   collect(DISTINCT r.SourceNet) + collect(DISTINCT r.DestNet) AS usedNets
              OPTIONAL MATCH (g:AddressGroup) WHERE (trim(coalesce(g.Zone, "")) = "" OR NOT g.Zone IN usedZones)
                AND NOT g.ObjectName IN usedNets
                AND NOT exists { MATCH (g)-[:InAddressGroup*1..10]->(m:AddressGroup)
                                 WHERE m.ObjectName IN usedNets OR (trim(coalesce(m.Zone, "")) <> "" AND m.Zone IN usedZones) }
              WITH usedZones, usedNets, g ORDER BY g.ObjectName
              WITH usedZones, usedNets, collect(g) AS groups
              OPTIONAL MATCH (a:IPAddress) WHERE (trim(coalesce(a.Zone, "")) = "" OR NOT a.Zone IN usedZones)
                AND NOT a.ObjectName IN usedNets
                AND NOT exists { MATCH (a)-[:InAddressGroup*1..10]->(m:AddressGroup)
                                 WHERE m.ObjectName IN usedNets OR (trim(coalesce(m.Zone, "")) <> "" AND m.Zone IN usedZones) }
              WITH groups, a ORDER BY a.ObjectName
              WITH groups, collect(a) AS addrs
              WHERE size(groups) + size(addrs) > 0
              RETURN CASE WHEN size(groups) = 0 THEN "" ELSE
                       "**Address groups**\n\n| Name | Zone | Members |\n|---|---|---|\n" +
                       reduce(s = "", g IN groups | s + "| " + CASE WHEN g.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(g.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(g.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN g.Zone IS NULL THEN "(not set)" WHEN trim(toString(g.Zone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(g.Zone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + coalesce(replace(toString(g.AddressesCount), "|", "\\|"), "(not set)") + " |\n") END +
                     CASE WHEN size(groups) > 0 AND size(addrs) > 0 THEN "\n" ELSE "" END +
                     CASE WHEN size(addrs) = 0 THEN "" ELSE
                       "**Address objects**\n\n| Name | Zone | Address | Mask or End Address |\n|---|---|---|---|\n" +
                       reduce(s = "", a IN addrs | s + "| " + CASE WHEN a.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(a.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN a.Zone IS NULL THEN "(not set)" WHEN trim(toString(a.Zone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.Zone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN a.Ip1 IS NULL THEN "(not set)" WHEN trim(toString(a.Ip1)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.Ip1), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN a.Ip2 IS NULL THEN "(not set)" WHEN trim(toString(a.Ip2)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(a.Ip2), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") END AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset contains the address groups and address objects listed in the evidence, which no access rule uses. Each listed object either has no zone or belongs to a zone that no access rule uses, and is not the source or destination network of any access rule, either directly or through membership of an address group that a rule uses. Unused address objects frequently retain the addresses of systems that have been decommissioned or re-addressed. When such an object is later reused in a new rule without its contents being checked, the rule can grant access to an unintended host that has since taken over the address. Unused objects also add complexity to the configuration and slow down rule reviews.
