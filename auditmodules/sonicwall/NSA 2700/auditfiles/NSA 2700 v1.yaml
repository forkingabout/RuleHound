          WITH collect(DISTINCT r.DestService) + collect(DISTINCT r.SourceService) AS usedSvcs
          MATCH (s:Service) WHERE NOT s.ObjectName IN usedSvcs
            AND NOT exists { MATCH (s)-[:InServiceGroup*1..10]->(m:ServiceGroup) WHERE m.ObjectName IN usedSvcs }
