        CumulativeSeverity: 3.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.idpPreventHighPriority IS NOT NULL
                AND (s.idpPreventHighPriority <> "on" OR s.idpPreventMediumPriority <> "on")
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| Prevent high priority attacks | idpPreventHighPriority | " + CASE WHEN s.idpPreventHighPriority IS NULL THEN "(not set)" WHEN trim(toString(s.idpPreventHighPriority)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.idpPreventHighPriority), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Detect high priority attacks | idpDetectHighPriority | " + CASE WHEN s.idpDetectHighPriority IS NULL THEN "(not set)" WHEN trim(toString(s.idpDetectHighPriority)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.idpDetectHighPriority), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Prevent medium priority attacks | idpPreventMediumPriority | " + CASE WHEN s.idpPreventMediumPriority IS NULL THEN "(not set)" WHEN trim(toString(s.idpPreventMediumPriority)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.idpPreventMediumPriority), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Detect medium priority attacks | idpDetectMediumPriority | " + CASE WHEN s.idpDetectMediumPriority IS NULL THEN "(not set)" WHEN trim(toString(s.idpDetectMediumPriority)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.idpDetectMediumPriority), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Prevent low priority attacks | idpPreventLowPriority | " + CASE WHEN s.idpPreventLowPriority IS NULL THEN "(not set)" WHEN trim(toString(s.idpPreventLowPriority)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.idpPreventLowPriority), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset detects but does not prevent high or medium priority intrusion signatures, because the configuration properties `idpPreventHighPriority` or `idpPreventMediumPriority` are not enabled. Known exploits against internal and demilitarised zone (DMZ) services are therefore logged but allowed to reach their targets. Detection without prevention means that the intrusion prevention service records an attack only after the malicious traffic has already been delivered to its target. High and medium priority signatures cover remote code execution, privilege escalation and other exploits against widely deployed software, so allowing this traffic through leaves internal and published services exposed to attacks that the affected asset is already able to recognise.
