            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Object**, then **Match Objects**, then **Addresses**, and create an address group containing only the workstations or jump hosts from which administrators manage the affected asset. Navigate to **Network**, then **System**, then **Interfaces**, and for each interface listed in the evidence either disable the management service entirely or set its source restriction to the administrator address group, so that `https_mgmt_src_addr`, `ssh_mgmt_src_addr` and `http_mgmt_src_addr` are populated for every enabled service. Disable all management services on interfaces in internet-facing zones; where remote administration is required, require administrators to connect through the virtual private network (VPN) with multi-factor authentication (MFA) and then reach a restricted internal management interface. After the change, attempt to reach the management interface from an address outside the administrator group and confirm that the connection is refused, and confirm through a fresh configuration export that no enabled management service has an empty source restriction.
          Plural: |-
