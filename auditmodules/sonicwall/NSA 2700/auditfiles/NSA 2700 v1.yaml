        Audit: |-
          MATCH (s)
          WHERE s.gavEnableScanning IS NOT NULL AND s.gavEnableScanning <> "on"
          RETURN s.gavEnableScanning AS gavEnableScanning;
        SoloSeverity: 7.5
        CumulativeSeverity: 3.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.gavEnableScanning IS NOT NULL AND s.gavEnableScanning <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Enable gateway anti-virus | gavEnableScanning | " + CASE WHEN s.gavEnableScanning IS NULL THEN "(not set)" WHEN trim(toString(s.gavEnableScanning)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.gavEnableScanning), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset performs no gateway anti-virus scanning, because the configuration property `gavEnableScanning` is not enabled. Malware delivered over the Hypertext Transfer Protocol (HTTP), the File Transfer Protocol (FTP), the Simple Mail Transfer Protocol (SMTP), the Post Office Protocol version 3 (POP3), the Internet Message Access Protocol (IMAP) and file sharing protocols therefore reaches internal hosts without being scanned at the perimeter. Email attachments and web downloads remain the most common delivery routes for ransomware and other malware. Scanning at the perimeter provides a layer of protection that is independent of the endpoint, and protects devices that cannot run endpoint software or whose protection is out of date.
