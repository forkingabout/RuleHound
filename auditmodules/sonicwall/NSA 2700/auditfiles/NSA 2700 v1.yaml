  - Name: "SNMP Version 3 Misconfigurations"
    Severity: 5.3
    CumulativeRisk: false
    Intro:
      Singular: |-
        The Simple Network Management Protocol (SNMP) related settings of the affected asset were found to enforce a configuration which may present vulnerabilities. The following issues were identified:
      Plural: |-
        The Simple Network Management Protocol (SNMP) related settings of the affected assets were found to enforce a configuration which may present vulnerabilities. The following issues were identified:
    GlobalVars: []
    Subs:
      - Name: "Community-Based SNMP Versions Permitted"
        Audit: |-
          MATCH (s:SNMPSettings)
          WHERE s.snmp_Enable = "on" AND coalesce(s.Snmp3_Mand_Required, "off") <> "on"
          RETURN s.snmp_Enable AS snmp_Enable, s.Snmp3_Mand_Required AS Snmp3_Mand_Required, s.snmp_GetCommunity AS snmp_GetCommunity;
        SoloSeverity: 5.3
        CumulativeSeverity: 3.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s:SNMPSettings)
              WHERE s.snmp_Enable = "on" AND coalesce(s.Snmp3_Mand_Required, "off") <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| SNMP agent enabled | snmp_Enable | " + CASE WHEN s.snmp_Enable IS NULL THEN "(not set)" WHEN trim(toString(s.snmp_Enable)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.snmp_Enable), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| SNMPv3 mandatory | Snmp3_Mand_Required | " + CASE WHEN s.Snmp3_Mand_Required IS NULL THEN "(not set)" WHEN trim(toString(s.Snmp3_Mand_Required)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.Snmp3_Mand_Required), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Read community | snmp_GetCommunity | " + CASE WHEN s.snmp_GetCommunity IS NULL THEN "(not set)" WHEN trim(toString(s.snmp_GetCommunity)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.snmp_GetCommunity), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Trap community | snmp_TrapCommunity | " + CASE WHEN s.snmp_TrapCommunity IS NULL THEN "(not set)" WHEN trim(toString(s.snmp_TrapCommunity)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.snmp_TrapCommunity), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset accepts Simple Network Management Protocol (SNMP) version 1 and version 2c requests, because the agent is enabled and the configuration property `Snmp3_Mand_Required`, which makes version 3 mandatory, is not enabled. These older versions authenticate requests only with a community string that is sent in clear text in every request, and they provide no encryption of the data returned. Any host on the network path between the monitoring system and the affected asset can capture the community string and reuse it to query the agent. Community strings are frequently reused across many devices, so a string captured from one device may give access to others.
              Plural: |-
                The affected assets accept Simple Network Management Protocol (SNMP) version 1 and version 2c requests, because the agent is enabled and the configuration property `Snmp3_Mand_Required`, which makes version 3 mandatory, is not enabled. These older versions authenticate requests only with a community string that is sent in clear text in every request, and they provide no encryption of the data returned. Any host on the network path between the monitoring system and the affected assets can capture the community string and reuse it to query the agent. Community strings are frequently reused across many devices, so a string captured from one device may give access to others.
