      - Name: "Intrusion Prevention Not Blocking High And Medium Priority Attacks"
        Audit: |-
          MATCH (s)
          WHERE s.idpPreventHighPriority IS NOT NULL
            AND (s.idpPreventHighPriority <> "on" OR s.idpPreventMediumPriority <> "on")
          RETURN s.idpPreventHighPriority AS idpPreventHighPriority, s.idpPreventMediumPriority AS idpPreventMediumPriority;
