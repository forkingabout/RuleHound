          - Name: "Remediation"
            SoloText:
              Singular: |-
                Within the SonicOS management interface, navigate to **Network**, then **System**, then **Interfaces**, and disable each interface listed in the evidence that is not required, using the option to shut down the port. Document the intended use of any interface that is kept in reserve, and require change control approval before an interface is assigned to a zone. Confirm the physical connection status of each listed port before disabling it, and include unused interfaces in the regular configuration review so that ports are not re-enabled without approval.
