      - Name: "IP Spoof Checking Disabled"
        Audit: |-
          MATCH (s)
          WHERE s.IPSpoofChecking IS NOT NULL AND s.IPSpoofChecking <> "on"
          RETURN s.IPSpoofChecking AS IPSpoofChecking;
        SoloSeverity: 5.3
        CumulativeSeverity: 2.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.IPSpoofChecking IS NOT NULL AND s.IPSpoofChecking <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| IP spoof checking | IPSpoofChecking | " + CASE WHEN s.IPSpoofChecking IS NULL THEN "(not set)" WHEN trim(toString(s.IPSpoofChecking)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.IPSpoofChecking), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset accepts packets whose source address does not belong to the network of the interface on which they arrive, because the configuration property `IPSpoofChecking` is not enabled. An attacker can therefore send packets with forged internal source addresses that may be permitted by rules intended only for internal hosts. Access rules that trust internal source addresses assume that packets claiming to come from those addresses really originate inside the network. Without spoof checking, this assumption does not hold, and an attacker on an untrusted network can craft packets that bypass such rules or that disguise the true source of an attack.
