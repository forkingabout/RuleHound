            For each rule listed in the evidence, replace the clear text protocol with its encrypted equivalent: Secure File Transfer Protocol (SFTP) or File Transfer Protocol over Transport Layer Security (FTPS) in place of the File Transfer Protocol (FTP), Secure Shell (SSH) in place of Telnet and the remote login services, the Simple Mail Transfer Protocol (SMTP) with mandatory STARTTLS on port 587 for client submission, the Hypertext Transfer Protocol Secure (HTTPS) in place of the Hypertext Transfer Protocol (HTTP), the Post Office Protocol version 3 (POP3) over Transport Layer Security (TLS) on port 995, the Internet Message Access Protocol (IMAP) over Transport Layer Security (TLS) on port 993, the Simple Network Management Protocol (SNMP) version 3 with authentication and privacy, and the Lightweight Directory Access Protocol (LDAP) over Transport Layer Security (TLS) on port 636. Within the SonicOS management interface, navigate to **Policy**, then **Rules and Policies**, then **Access Rules**, and remove the clear text service objects from each rule and from the service groups the rules reference. Where a clear text protocol cannot yet be retired, restrict the rule to the specific hosts that require it and document the exception with a planned removal date.
