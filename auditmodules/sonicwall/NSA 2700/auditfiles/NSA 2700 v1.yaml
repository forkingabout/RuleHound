    Subs:
      - Name: "No Web Login Page Banner"
        Audit: |-
          OPTIONAL MATCH (u:UserAuthSettings)
          WITH u
          WHERE coalesce(u.userPolicyBannerEnable, "off") <> "on" AND trim(coalesce(u.userPolicyBannerText, "")) = ""
          RETURN u.userPolicyBannerEnable AS userPolicyBannerEnable, u.userPolicyBannerText AS userPolicyBannerText;
        SoloSeverity: 3.1
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              OPTIONAL MATCH (u:UserAuthSettings)
              WITH u
              WHERE coalesce(u.userPolicyBannerEnable, "off") <> "on" AND trim(coalesce(u.userPolicyBannerText, "")) = ""
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| User login policy banner enabled | userPolicyBannerEnable | " + CASE WHEN u.userPolicyBannerEnable IS NULL THEN "(not set)" WHEN trim(toString(u.userPolicyBannerEnable)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.userPolicyBannerEnable), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| User login policy banner text | userPolicyBannerText | " + CASE WHEN u.userPolicyBannerText IS NULL THEN "(not set)" WHEN trim(toString(u.userPolicyBannerText)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(u.userPolicyBannerText), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset presents its web login page without a pre-login policy banner: the configuration property `userPolicyBannerEnable` is set to `off` and `userPolicyBannerText` is empty. Administrators and users therefore authenticate without being informed that access is restricted to authorised persons, that activity is monitored and recorded, and that unauthorised use may result in disciplinary or legal action. The absence of such a warning can weaken the organisation's position when taking legal or disciplinary action against unauthorised access, and removes a deterrent to casual misuse.
