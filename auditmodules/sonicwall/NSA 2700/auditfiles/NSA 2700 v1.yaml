  - Name: "Overly Permissive Firewall Rules"
    Severity: 7.5
    CumulativeRisk: false
    Intro:
      Singular: |-
        The affected asset enforces enabled Allow access rules that use Any in place of specific networks or services. These rules permit traffic beyond what the business requires and enable lateral movement between zones. The following rule types were identified:
      Plural: |-
        The affected assets enforce enabled Allow access rules that use Any in place of specific networks or services. These rules permit traffic beyond what the business requires and enable lateral movement between zones. The following rule types were identified:
    GlobalVars: []
    Subs:
      - Name: "Rules Allow Any Source, Destination And Service"
        Audit: |-
          MATCH (r)
          WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true" AND r.ActionName = "Allow" AND r.SourceNet = "Any" AND r.DestNet = "Any" AND r.DestService = "Any" AND r.SourceService = "Any"
          RETURN CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END AS IPVersion, r.Priority AS Priority, r.SourceZone AS SourceZone, r.DestZone AS DestZone,
                 r.SourceNet AS Source, r.DestNet AS Destination, r.DestService AS Service, r.ObjectName AS Name
          ORDER BY IPVersion, toInteger(Priority);
        SoloSeverity: 7.5
        CumulativeSeverity: 3.0
        Flag:
          - Message: "Results include SonicOS-generated default rules (Name \"Default Access Rule\"); decide whether to report defaults alongside administrator-created rules."
            Query: |-
              MATCH (r) WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true" AND r.ActionName = "Allow" AND r.ObjectName = "Default Access Rule" AND (r.SourceNet = "Any" OR r.DestNet = "Any" OR r.DestService = "Any") RETURN r.Priority AS Priority;
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (r)
              WHERE (r:AccessRule OR r:AccessRuleV6) AND toString(r.Enabled) = "true" AND r.ActionName = "Allow" AND r.SourceNet = "Any" AND r.DestNet = "Any" AND r.DestService = "Any" AND r.SourceService = "Any"
              WITH r ORDER BY CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END, toInteger(r.Priority)
              WITH collect(r) AS rules
              WHERE size(rules) > 0
              RETURN "| IP Version | Priority | Source Zone | Destination Zone | Source | Destination | Service | Name | Comment |\n|---|---|---|---|---|---|---|---|---|\n" + reduce(s = "", r IN rules | s + "| " + CASE WHEN r:AccessRuleV6 THEN "IPv6" ELSE "IPv4" END + " | " + coalesce(replace(toString(r.Priority), "|", "\\|"), "(not set)") + " | " + CASE WHEN r.SourceZone IS NULL THEN "(not set)" WHEN trim(toString(r.SourceZone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.SourceZone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.DestZone IS NULL THEN "(not set)" WHEN trim(toString(r.DestZone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.DestZone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.SourceNet IS NULL THEN "(not set)" WHEN trim(toString(r.SourceNet)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.SourceNet), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.DestNet IS NULL THEN "(not set)" WHEN trim(toString(r.DestNet)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.DestNet), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.DestService IS NULL THEN "(not set)" WHEN trim(toString(r.DestService)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.DestService), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(r.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.Comment IS NULL THEN "(not set)" WHEN trim(toString(r.Comment)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.Comment), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset permits all traffic between the zone pairs listed in the evidence, because each of these enabled rules allows any source network to reach any destination network on any service. Every host in the source zone can therefore reach every host and every listening port in the destination zone. If a single device in the source zone is compromised, the attacker can use it to reach and attack every service in the destination zone, including administrative interfaces and legacy services that were never intended to be exposed. Rules of this kind defeat the purpose of zone-based segmentation and significantly increase the impact of any compromise.
              Plural: |-
                The affected assets permit all traffic between the zone pairs listed in the evidence, because each of these enabled rules allows any source network to reach any destination network on any service. Every host in the source zone can therefore reach every host and every listening port in the destination zone. If a single device in the source zone is compromised, the attacker can use it to reach and attack every service in the destination zone, including administrative interfaces and legacy services that were never intended to be exposed. Rules of this kind defeat the purpose of zone-based segmentation and significantly increase the impact of any compromise.
