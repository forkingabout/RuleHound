  - Name: "Weak VPN Policy Settings"
    Severity: 4.3
    CumulativeRisk: false
    Intro:
      Singular: |-
        The affected asset has enabled Internet Protocol Security (IPsec) virtual private network (VPN) policies with weakened settings. The following conditions were identified:
      Plural: |-
        The affected assets have enabled Internet Protocol Security (IPsec) virtual private network (VPN) policies with weakened settings. The following conditions were identified:
    GlobalVars: []
    Subs:
      - Name: "Perfect Forward Secrecy Disabled On VPN Policies"
        Audit: |-
          MATCH (v:VPNPolicy)
          WHERE coalesce(v.SaDisabled, "off") <> "on" AND coalesce(v.PFSEnablePFS, "off") <> "on"
          RETURN v.ObjectName AS VPNPolicy, v.GwAddr AS Gateway, v.PFSEnablePFS AS PFSEnablePFS
          ORDER BY VPNPolicy;
        SoloSeverity: 4.3
        CumulativeSeverity: 2.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (v:VPNPolicy)
              WHERE coalesce(v.SaDisabled, "off") <> "on" AND coalesce(v.PFSEnablePFS, "off") <> "on"
              WITH v ORDER BY v.ObjectName
              WITH collect(v) AS policies
              WHERE size(policies) > 0
              RETURN "| VPN Policy | Gateway (ipsecGwAddr) | SA Disabled (ipsecSaDisabled) | PFS (ipsecPFSEnablePFS) | Phase 2 DH Group (ipsecP2DHGrp) |\n|---|---|---|---|---|\n" +
                     reduce(s = "", v IN policies | s + "| " + CASE WHEN v.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(v.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(v.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN v.GwAddr IS NULL THEN "(not set)" WHEN trim(toString(v.GwAddr)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(v.GwAddr), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN v.SaDisabled IS NULL THEN "(not set)" WHEN trim(toString(v.SaDisabled)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(v.SaDisabled), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                            CASE WHEN v.PFSEnablePFS IS NULL THEN "(not set)" WHEN trim(toString(v.PFSEnablePFS)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(v.PFSEnablePFS), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN v.P2DHGrp IS NULL THEN "(not set)" WHEN trim(toString(v.P2DHGrp)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(v.P2DHGrp), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset negotiates second phase keys on the enabled virtual private network (VPN) policies listed in the evidence without perfect forward secrecy, because the configuration property `PFSEnablePFS` is not enabled. If the key material of a single Internet Key Exchange (IKE) session is compromised, every tunnel session derived from it can be decrypted, exposing the traffic carried by the virtual private network (VPN). Traffic carried over site-to-site virtual private networks frequently includes authentication traffic, file transfers and database connections between sites. An attacker who records encrypted tunnel traffic over a long period and later obtains key material could decrypt all of that recorded traffic if perfect forward secrecy is not used.
              Plural: |-
                The affected assets negotiate second phase keys on the enabled virtual private network (VPN) policies listed in the evidence without perfect forward secrecy, because the configuration property `PFSEnablePFS` is not enabled. If the key material of a single Internet Key Exchange (IKE) session is compromised, every tunnel session derived from it can be decrypted, exposing the traffic carried by the virtual private network (VPN). Traffic carried over site-to-site virtual private networks frequently includes authentication traffic, file transfers and database connections between sites. An attacker who records encrypted tunnel traffic over a long period and later obtains key material could decrypt all of that recorded traffic if perfect forward secrecy is not used.
            BatchText:
              Singular: |-
                The affected asset negotiates second phase keys on the enabled virtual private network (VPN) policies listed in the evidence without perfect forward secrecy, because the configuration property `PFSEnablePFS` is not enabled. If the key material of a single Internet Key Exchange (IKE) session is compromised, every tunnel session derived from it can be decrypted, exposing the traffic carried by the virtual private network (VPN). Traffic carried over site-to-site virtual private networks frequently includes authentication traffic, file transfers and database connections between sites. An attacker who records encrypted tunnel traffic over a long period and later obtains key material could decrypt all of that recorded traffic if perfect forward secrecy is not used.
              Plural: |-
                The affected assets negotiate second phase keys on the enabled virtual private network (VPN) policies listed in the evidence without perfect forward secrecy, because the configuration property `PFSEnablePFS` is not enabled. If the key material of a single Internet Key Exchange (IKE) session is compromised, every tunnel session derived from it can be decrypted, exposing the traffic carried by the virtual private network (VPN). Traffic carried over site-to-site virtual private networks frequently includes authentication traffic, file transfers and database connections between sites. An attacker who records encrypted tunnel traffic over a long period and later obtains key material could decrypt all of that recorded traffic if perfect forward secrecy is not used.
          - Name: "Evidence"
            SoloText:
              Singular: |-
                The following values were extracted from the configuration of the affected asset:

                {evidence}
              Plural: |-
                The following values were extracted from the configuration of the affected assets:

                {evidence}
            BatchText:
              Singular: |-
                {evidence}
              Plural: |-
                {evidence}
          - Name: "Remediation"
            SoloText:
              Singular: |-
                Within the SonicOS management interface, navigate to **Network**, then **IPSec VPN**, then **Rules and Settings**, edit each policy listed in the evidence, and enable perfect forward secrecy for the second phase using Diffie-Hellman group 14 or higher. Coordinate the change with the administrator of the remote peer so that both ends use matching settings. Confirm after the change that the tunnel re-establishes successfully with the new settings, and include perfect forward secrecy in the organisation's virtual private network (VPN) configuration standard.
              Plural: |-
