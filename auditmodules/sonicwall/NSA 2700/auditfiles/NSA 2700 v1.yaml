      - Name: "Log Events With No Destination"
        Audit: |-
          MATCH (s:LogEventSettings)
          UNWIND coalesce(s.logEvtAttrs, []) AS entry
          WITH substring(entry, size(split(entry, "=")[0]) + 1) AS attrs
          WITH attrs, split(attrs, ",") AS f
          WHERE size(f) > 3 AND f[1] =~ "0+"
          RETURN f[0] AS EventId, f[1] AS DestinationFlags, f[3] AS Priority, attrs AS logEvtAttrs
          ORDER BY EventId;
        SoloSeverity: 4.3
        CumulativeSeverity: 1.5
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s:LogEventSettings)
              UNWIND coalesce(s.logEvtAttrs, []) AS entry
              WITH substring(entry, size(split(entry, "=")[0]) + 1) AS attrs
              WITH attrs, split(attrs, ",") AS f
              WHERE size(f) > 3 AND f[1] =~ "0+"
              WITH attrs, f ORDER BY f[0]
              WITH collect({attrs: attrs, f: f}) AS rows
              WHERE size(rows) > 0
              RETURN "| Event ID | Destination Flags | Priority | logEvtAttrs |\n|---|---|---|---|\n" +
                     reduce(t = "", r IN rows | t + "| " + CASE WHEN r.f[0] IS NULL THEN "(not set)" WHEN trim(toString(r.f[0])) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.f[0]), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.f[1] IS NULL THEN "(not set)" WHEN trim(toString(r.f[1])) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.f[1]), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.f[3] IS NULL THEN "(not set)" WHEN trim(toString(r.f[3])) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.f[3]), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.attrs IS NULL THEN "(not set)" WHEN trim(toString(r.attrs)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.attrs), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                In addition to category settings, SonicOS stores logging attributes for each individual event in the configuration property `logEvtAttrs`. Each entry records the event identifier, a destination flags field, a display colour and a priority. When the destination flags field of an event is zero, every destination for that event has been switched off. On the affected asset, one or more events have been explicitly configured in this way, so each occurrence of those events is discarded without being written to the local event log, forwarded to syslog or sent by email. Disabling individual events in this manner is a technique that can be used to conceal specific activity, and regardless of intent it creates gaps in the audit trail that an attacker can exploit.
              Plural: |-
                In addition to category settings, SonicOS stores logging attributes for each individual event in the configuration property `logEvtAttrs`. Each entry records the event identifier, a destination flags field, a display colour and a priority. When the destination flags field of an event is zero, every destination for that event has been switched off. On the affected assets, one or more events have been explicitly configured in this way, so each occurrence of those events is discarded without being written to the local event log, forwarded to syslog or sent by email. Disabling individual events in this manner is a technique that can be used to conceal specific activity, and regardless of intent it creates gaps in the audit trail that an attacker can exploit.
