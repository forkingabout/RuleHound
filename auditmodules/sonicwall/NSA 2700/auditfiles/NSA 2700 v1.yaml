      - Name: "IP Identification Randomisation Disabled"
        Audit: |-
          MATCH (s)
          WHERE s.randomizeIds IS NOT NULL AND s.randomizeIds <> "on"
          RETURN s.randomizeIds AS randomizeIds;
        SoloSeverity: 2.0
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.randomizeIds IS NOT NULL AND s.randomizeIds <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Randomize IP ID | randomizeIds | " + CASE WHEN s.randomizeIds IS NULL THEN "(not set)" WHEN trim(toString(s.randomizeIds)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.randomizeIds), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset generates sequential Internet Protocol (IP) identification values, because the configuration property `randomizeIds` is not enabled. Predictable identification values enable idle scanning and host counting techniques that use the affected asset to probe other systems indirectly. In an idle scan, an attacker sends forged packets that appear to come from the affected device and then observes changes in its identification counter to determine which ports are open on a third system, without ever revealing the attacker's own address to the target. Sequential values also allow an observer to estimate how many hosts sit behind an address translation boundary and how much traffic they generate.
              Plural: |-
                The affected assets generate sequential Internet Protocol (IP) identification values, because the configuration property `randomizeIds` is not enabled. Predictable identification values enable idle scanning and host counting techniques that use the affected assets to probe other systems indirectly. In an idle scan, an attacker sends forged packets that appear to come from the affected device and then observes changes in its identification counter to determine which ports are open on a third system, without ever revealing the attacker's own address to the target. Sequential values also allow an observer to estimate how many hosts sit behind an address translation boundary and how much traffic they generate.
