      - Name: "Inbound NAT From Any Source"
        Audit: |-
          MATCH (n)
          WHERE (n:NATRule OR n:NATRuleV6)
            AND toString(n.Enabled) = "true"
            AND n.OriginalSource = "Any"
            AND n.TranslatedDest <> "Original"
            AND (NOT exists { MATCH (n)-[:HasInboundInterface]->() }
                 OR exists { MATCH (n)-[:HasInboundInterface]->(:Interface)<-[:HasInterface]-(:Zone {ZoneType: "0"}) })
          RETURN n.ObjectName AS Name, n.OriginalDest AS OriginalDestination, n.OriginalService AS OriginalService,
                 n.TranslatedDest AS TranslatedDestination, n.TranslatedService AS TranslatedService, n.SrcIface AS InboundInterface
          ORDER BY Name;
        SoloSeverity: 6.5
        CumulativeSeverity: 3.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (n)
              WHERE (n:NATRule OR n:NATRuleV6)
                AND toString(n.Enabled) = "true"
                AND n.OriginalSource = "Any"
                AND n.TranslatedDest <> "Original"
                AND (NOT exists { MATCH (n)-[:HasInboundInterface]->() }
                     OR exists { MATCH (n)-[:HasInboundInterface]->(:Interface)<-[:HasInterface]-(:Zone {ZoneType: "0"}) })
              OPTIONAL MATCH (n)-[:HasInboundInterface]->(i:Interface)
              WITH n, i ORDER BY n.Index
              WITH collect({n: n, i: i}) AS rows
              WHERE size(rows) > 0
              RETURN "| Name | Original Source | Original Destination | Original Service | Translated Destination | Translated Service | Inbound Interface | Comment |\n|---|---|---|---|---|---|---|---|\n" +
                     reduce(s = "", x IN rows | s + "| " + CASE WHEN x.n.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(x.n.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.n.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.n.OriginalSource IS NULL THEN "(not set)" WHEN trim(toString(x.n.OriginalSource)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.n.OriginalSource), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.n.OriginalDest IS NULL THEN "(not set)" WHEN trim(toString(x.n.OriginalDest)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.n.OriginalDest), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
