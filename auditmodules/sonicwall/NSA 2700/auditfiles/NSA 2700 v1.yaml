    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset enforces enabled Allow rules whose service, either directly or through nested service groups, includes a protocol that transmits credentials and data without encryption. The protocols identified include the File Transfer Protocol (FTP) on Transmission Control Protocol (TCP) ports 20 and 21, Telnet on port 23, the Simple Mail Transfer Protocol (SMTP) on port 25, the Trivial File Transfer Protocol (TFTP) on User Datagram Protocol (UDP) port 69, the Hypertext Transfer Protocol (HTTP) on ports 80 and 8080, the Post Office Protocol version 3 (POP3) on port 110, the Network News Transfer Protocol (NNTP) on port 119, the Internet Message Access Protocol (IMAP) on port 143, the Simple Network Management Protocol (SNMP) on ports 161 and 162, the Lightweight Directory Access Protocol (LDAP) on port 389, the remote execution, remote login and remote shell services on ports 512 to 514, syslog on User Datagram Protocol (UDP) port 514, Message Queuing Telemetry Transport (MQTT) on port 1883 and Virtual Network Computing (VNC) on port 5900. An attacker positioned on any network segment that this traffic crosses can capture usernames, passwords, session identifiers and business data in clear text, and can modify the traffic in transit.
