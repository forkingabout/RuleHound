              WHERE size(ifaces) > 0
              RETURN "| Interface | Zone | IP Address | Comment |\n|---|---|---|---|\n" +
                     reduce(s = "", i IN ifaces | s + "| " + coalesce(replace(toString(i.ObjectName), "|", "\\|"), "(not set)") + " | " + CASE WHEN i.Zone IS NULL THEN "(not set)" WHEN trim(toString(i.Zone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.Zone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN i.IPAddress IS NULL THEN "(not set)" WHEN trim(toString(i.IPAddress)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.IPAddress), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN i.comment IS NULL THEN "(not set)" WHEN trim(toString(i.comment)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(i.comment), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset has the interfaces listed in the evidence, which are not assigned to any zone and are not referenced by any rule, route, network address translation (NAT) policy or other object. An unused interface that is later cabled and assigned to a zone without review can bypass the intended zone design and create an unmonitored path into the network. Physical ports that remain enabled can be used by anyone with physical access to the equipment, including visitors, contractors and malicious insiders, and a port that is enabled but not monitored may not attract attention if it is connected without authorisation. Disabling unused ports reduces the physical attack surface of the network perimeter.
