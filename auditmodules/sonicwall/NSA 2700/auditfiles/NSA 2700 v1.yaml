        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset enforces no password complexity for local administrator and user accounts, because the configuration property `passwordComplexity` is set to `0`. Passwords that consist of a single dictionary word therefore satisfy the policy and can be guessed or cracked quickly. Password guessing tools try dictionary words, common substitutions and previously breached passwords first, and these are exactly the passwords that a policy without complexity requirements permits. A successful guess against an administrator account gives the attacker full control of the network perimeter, while a successful guess against a user account can provide remote access to the internal network.
