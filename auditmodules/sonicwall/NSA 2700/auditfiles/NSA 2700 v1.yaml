        CumulativeSeverity: 3.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              OPTIONAL MATCH (l:LoginSecurityPolicy)
              WITH l
              WHERE l IS NULL OR toString(l.LockoutEnabled) <> "true"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" +
                     "| Lock out after failed logins | loginFailLockoutEnable | " + CASE WHEN l.loginFailLockoutEnable IS NULL THEN "(not set)" WHEN trim(toString(l.loginFailLockoutEnable)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.loginFailLockoutEnable), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Lock out the user account | loginFailAcctLockoutEnable | " + CASE WHEN l.loginFailAcctLockoutEnable IS NULL THEN "(not set)" WHEN trim(toString(l.loginFailAcctLockoutEnable)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.loginFailAcctLockoutEnable), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Failed attempts allowed | loginFailMaxRate | " + CASE WHEN l.loginFailMaxRate IS NULL THEN "(not set)" WHEN trim(toString(l.loginFailMaxRate)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.loginFailMaxRate), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Failure window | loginFailDuration | " + CASE WHEN l.loginFailDuration IS NULL THEN "(not set)" WHEN trim(toString(l.loginFailDuration)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.loginFailDuration), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" +
                     "| Lockout period | loginFailLockoutTime | " + CASE WHEN l.loginFailLockoutTime IS NULL THEN "(not set)" WHEN trim(toString(l.loginFailLockoutTime)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(l.loginFailLockoutTime), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset imposes no lockout after failed login attempts, because the configuration property `loginFailLockoutEnable` is not enabled. An attacker can therefore attempt an unlimited number of password guesses against the administrator and user accounts through the management and user login interfaces. Automated tools can test thousands of passwords per hour against an exposed login page, and without lockout the only limit on such an attack is the speed of the network. Where the management or virtual private network (VPN) interface is reachable from the internet, this allows any attacker to conduct a sustained guessing campaign against the administrator account and every local user account.
