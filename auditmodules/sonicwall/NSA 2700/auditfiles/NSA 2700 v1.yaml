  - Name: "ICMP Ping Enabled On Untrusted Interfaces"
    Severity: 2.6
    Audit: |-
      MATCH (z:Zone {ZoneType: "0"})-[:HasInterface]->(i:Interface)
      WHERE i.ping_mgmt = "1" OR i.ping6_mgmt = "1"
      RETURN i.ObjectName AS Interface, z.ObjectName AS Zone, i.IPAddress AS IPAddress, i.ping_mgmt AS ping_mgmt
      ORDER BY Interface;
    Flag: []
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (z:Zone {ZoneType: "0"})-[:HasInterface]->(i:Interface)
          WHERE i.ping_mgmt = "1" OR i.ping6_mgmt = "1"
          WITH i, z ORDER BY i.ObjectName
          WITH collect({i: i, z: z}) AS rows
          WHERE size(rows) > 0
          RETURN "| Interface | Zone | IP Address | ping_mgmt | ping6_mgmt |\n|---|---|---|---|---|\n" +
                 reduce(s = "", x IN rows | s + "| " + coalesce(replace(toString(x.i.ObjectName), "|", "\\|"), "(not set)") + " | " + CASE WHEN x.z.ObjectName IS NULL THEN "(not set)" WHEN trim(toString(x.z.ObjectName)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.z.ObjectName), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.i.IPAddress IS NULL THEN "(not set)" WHEN trim(toString(x.i.IPAddress)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.i.IPAddress), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        CASE WHEN x.i.ping_mgmt IS NULL THEN "(not set)" WHEN trim(toString(x.i.ping_mgmt)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.i.ping_mgmt), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN x.i.ping6_mgmt IS NULL THEN "(not set)" WHEN trim(toString(x.i.ping6_mgmt)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(x.i.ping6_mgmt), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset responds to Internet Control Message Protocol (ICMP) echo requests on the internet-facing interfaces listed in the evidence, because the configuration property `ping_mgmt` is set to `1` on those interfaces. Responding to echo requests confirms the presence and address of the affected asset to automated network sweeps, and assists an attacker in mapping the network perimeter and identifying targets before attempting to exploit exposed services. While responding to echo requests is not a vulnerability in itself, it removes a simple obstacle to reconnaissance and makes the affected asset visible to opportunistic automated scanning across the internet.
          Plural: |-
            The affected assets respond to Internet Control Message Protocol (ICMP) echo requests on the internet-facing interfaces listed in the evidence, because the configuration property `ping_mgmt` is set to `1` on those interfaces. Responding to echo requests confirms the presence and address of the affected assets to automated network sweeps, and assists an attacker in mapping the network perimeter and identifying targets before attempting to exploit exposed services. While responding to echo requests is not a vulnerability in itself, it removes a simple obstacle to reconnaissance and makes the affected assets visible to opportunistic automated scanning across the internet.
      - Name: "Evidence"
        Text:
          Singular: |-
            The following values were extracted from the configuration of the affected asset:

            {evidence}
          Plural: |-
            The following values were extracted from the configuration of the affected assets:

            {evidence}
      - Name: "Remediation"
        Text:
          Singular: |-
            Within the SonicOS management interface, navigate to **Network**, then **System**, then **Interfaces**, edit each interface listed in the evidence, and clear the Ping option in the management section. Where an external monitoring service requires echo responses, create an access rule that permits Internet Control Message Protocol (ICMP) echo requests only from the monitoring service's address objects, rather than enabling ping for all sources. Confirm after the change from an external address that echo requests to the listed interfaces receive no response, while authorised monitoring continues to function.
          Plural: |-
            Within the SonicOS management interface, navigate to **Network**, then **System**, then **Interfaces**, edit each interface listed in the evidence, and clear the Ping option in the management section. Where an external monitoring service requires echo responses, create an access rule that permits Internet Control Message Protocol (ICMP) echo requests only from the monitoring service's address objects, rather than enabling ping for all sources. Confirm after the change from an external address that echo requests to the listed interfaces receive no response, while authorised monitoring continues to function.
  - Name: "Administrative Portal Access Has No Source Address Restrictions"
    Severity: 7.3
    Audit: |-
      MATCH (i:Interface)
      UNWIND [
        {flag: "https_mgmt", src: "https_mgmt_src_addr"}, {flag: "http_mgmt", src: "http_mgmt_src_addr"}, {flag: "ssh_mgmt", src: "ssh_mgmt_src_addr"},
        {flag: "https6_mgmt", src: "https_mgmt6_src_addr"}, {flag: "http6_mgmt", src: "http_mgmt6_src_addr"}, {flag: "ssh6_mgmt", src: "ssh_mgmt6_src_addr"}
      ] AS m
      WITH i, m
      WHERE i[m.flag] = "1" AND trim(coalesce(i[m.src], "")) = ""
      RETURN i.ObjectName AS Interface, i.Zone AS Zone, i.IPAddress AS IPAddress, m.flag AS Property, i[m.flag] AS Value, m.src AS SourceRestrictionProperty
      ORDER BY Interface, Property;
    Flag:
      - Message: "At least one affected interface belongs to an untrusted (WAN, ZoneType 0) zone: the exposure is reachable from the internet unless upstream filtering blocks it."
        Query: |-
          MATCH (z:Zone {ZoneType: "0"})-[:HasInterface]->(i:Interface)
          WHERE (i.https_mgmt = "1" AND trim(coalesce(i.https_mgmt_src_addr, "")) = "")
             OR (i.http_mgmt = "1" AND trim(coalesce(i.http_mgmt_src_addr, "")) = "")
             OR (i.ssh_mgmt = "1" AND trim(coalesce(i.ssh_mgmt_src_addr, "")) = "")
             OR (i.snmp_mgmt = "1" AND trim(coalesce(i.snmp_mgmt_src_addr, "")) = "")
          RETURN i.ObjectName AS Interface;
    Vars:
      - Name: "evidence"
        Query: |-
          MATCH (i:Interface)
          UNWIND [
            {flag: "https_mgmt", src: "https_mgmt_src_addr"}, {flag: "http_mgmt", src: "http_mgmt_src_addr"}, {flag: "ssh_mgmt", src: "ssh_mgmt_src_addr"},
            {flag: "https6_mgmt", src: "https_mgmt6_src_addr"}, {flag: "http6_mgmt", src: "http_mgmt6_src_addr"}, {flag: "ssh6_mgmt", src: "ssh_mgmt6_src_addr"}
          ] AS m
          WITH i, m
          WHERE i[m.flag] = "1" AND trim(coalesce(i[m.src], "")) = ""
          WITH i, m ORDER BY i.ObjectName, m.flag
          WITH collect({i: i, m: m}) AS rows
          WHERE size(rows) > 0
          RETURN "| Interface | Zone | IP Address | Property | Value | Source Restriction Property | Source Restriction Value |\n|---|---|---|---|---|---|---|\n" +
                 reduce(s = "", r IN rows | s + "| " + coalesce(replace(toString(r.i.ObjectName), "|", "\\|"), "(not set)") + " | " + CASE WHEN r.i.Zone IS NULL THEN "(not set)" WHEN trim(toString(r.i.Zone)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.i.Zone), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + CASE WHEN r.i.IPAddress IS NULL THEN "(not set)" WHEN trim(toString(r.i.IPAddress)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.i.IPAddress), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " +
                        r.m.flag + " | " + CASE WHEN r.i[r.m.flag] IS NULL THEN "(not set)" WHEN trim(toString(r.i[r.m.flag])) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.i[r.m.flag]), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " | " + r.m.src + " | " + CASE WHEN r.i[r.m.src] IS NULL THEN "(not set)" WHEN trim(toString(r.i[r.m.src])) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(r.i[r.m.src]), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n") AS Evidence;
    Sections:
      - Name: "Description"
        Text:
          Singular: |-
            The affected asset exposes the Hypertext Transfer Protocol Secure (HTTPS), Hypertext Transfer Protocol (HTTP) or Secure Shell (SSH) management services on the interfaces listed in the evidence with an empty source address restriction. For each listed management property, such as `https_mgmt`, `ssh_mgmt` or `http_mgmt`, the service is enabled and the corresponding restriction property, such as `https_mgmt_src_addr`, `ssh_mgmt_src_addr` or `http_mgmt_src_addr`, is empty. An empty restriction means that SonicOS accepts management connections from every address that can reach the interface, rather than only from the workstations and jump hosts used by administrators. Any host on the connected networks can therefore present credentials to the administrative interface, attempt to guess the administrator password, and attempt to exploit vulnerabilities in the SonicOS management plane. Where an affected interface belongs to an internet-facing zone, the administrative interface is exposed to the entire internet, which is one of the most common initial access routes in attacks against network perimeter devices. A successful attack against the management plane gives the attacker full control of the affected asset, including the ability to alter the security policy, disable inspection and create persistent administrator accounts.
          Plural: |-
            The affected assets expose the Hypertext Transfer Protocol Secure (HTTPS), Hypertext Transfer Protocol (HTTP) or Secure Shell (SSH) management services on the interfaces listed in the evidence with an empty source address restriction. For each listed management property, such as `https_mgmt`, `ssh_mgmt` or `http_mgmt`, the service is enabled and the corresponding restriction property, such as `https_mgmt_src_addr`, `ssh_mgmt_src_addr` or `http_mgmt_src_addr`, is empty. An empty restriction means that SonicOS accepts management connections from every address that can reach the interface, rather than only from the workstations and jump hosts used by administrators. Any host on the connected networks can therefore present credentials to the administrative interface, attempt to guess the administrator password, and attempt to exploit vulnerabilities in the SonicOS management plane. Where an affected interface belongs to an internet-facing zone, the administrative interface is exposed to the entire internet, which is one of the most common initial access routes in attacks against network perimeter devices. A successful attack against the management plane gives the attacker full control of the affected assets, including the ability to alter the security policy, disable inspection and create persistent administrator accounts.
      - Name: "Evidence"
        Text:
