        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset forwards Internet Protocol (IP) packets that carry source routing options, because the configuration property `dropSrcRoute` is not enabled. Source routing allows the sender to dictate the path that a packet takes, which can be used to bypass routing-based controls and to direct return traffic through attacker-controlled systems. Legitimate traffic on modern networks does not use source routing, and the option is disabled by default on most operating systems and network devices. Its only practical use is to manipulate packet paths, which an attacker can use to reach addresses that would otherwise not be routable or to bypass controls that depend on the normal routing path.
