  - Name: "Firewall Hardening Settings Disabled"
    Severity: 3.7
    CumulativeRisk: false
    Intro:
      Singular: |-
        Packet-handling protections that defend the affected asset and the hosts behind it against spoofing, reconnaissance and evasion techniques were found to be disabled. The following issues were identified:
      Plural: |-
        Packet-handling protections that defend the affected assets and the hosts behind them against spoofing, reconnaissance and evasion techniques were found to be disabled. The following issues were identified:
    GlobalVars: []
    Subs:
      - Name: "Stealth Mode Disabled"
        Audit: |-
          MATCH (s)
          WHERE s.enableStealthMode IS NOT NULL AND s.enableStealthMode <> "on"
          RETURN s.enableStealthMode AS enableStealthMode;
        SoloSeverity: 2.6
        CumulativeSeverity: 1.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.enableStealthMode IS NOT NULL AND s.enableStealthMode <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Enable stealth mode | enableStealthMode | " + CASE WHEN s.enableStealthMode IS NULL THEN "(not set)" WHEN trim(toString(s.enableStealthMode)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.enableStealthMode), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset responds to connection attempts on closed ports, because the configuration property `enableStealthMode` is not enabled. These responses confirm the presence of the affected asset and the state of its ports to network scanners, which assists an attacker in mapping the perimeter. When an unsolicited connection attempt to a closed port receives a reset or an error response, the scanner learns that a live device exists at that address and can infer details about its operating system and configuration. Silently dropping such attempts makes reconnaissance slower and less informative, and reduces the visibility of the affected asset to opportunistic automated scanning.
