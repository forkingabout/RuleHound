                Within the SonicOS management interface, navigate to **Device**, then **Log**, then **Settings**. For every log category listed in the evidence, enable at least the local event log destination and the syslog destination, and apply the setting to all events within the category so that no event is left without a destination. Where the organisation relies on email alerting for critical events, also enable the email alert destination for the relevant categories. After applying the change, export the configuration again and confirm that every `logCtgrSf` value is non-zero, and confirm at the syslog collector that events from the corrected categories are being received.
