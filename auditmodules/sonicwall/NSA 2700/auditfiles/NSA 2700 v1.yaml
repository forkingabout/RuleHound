                {evidence}
              Plural: |-
                {evidence}
          - Name: "Remediation"
            SoloText:
              Singular: |-
                Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **SNMP**. Create Simple Network Management Protocol (SNMP) version 3 users that use the Secure Hash Algorithm (SHA) for authentication and the Advanced Encryption Standard (AES) for privacy, and configure the monitoring platform to use these users. Once monitoring has been migrated, enable the option that makes Simple Network Management Protocol (SNMP) version 3 mandatory and remove the version 1 and version 2c community strings.
              Plural: |-
                Within the SonicOS management interface, navigate to **Device**, then **Settings**, then **SNMP**. Create Simple Network Management Protocol (SNMP) version 3 users that use the Secure Hash Algorithm (SHA) for authentication and the Advanced Encryption Standard (AES) for privacy, and configure the monitoring platform to use these users. Once monitoring has been migrated, enable the option that makes Simple Network Management Protocol (SNMP) version 3 mandatory and remove the version 1 and version 2c community strings.
