      - Name: "DPI-SSL Client Inspection Disabled"
        Audit: |-
          MATCH (s)
          WHERE s.sslSpyEnabled IS NOT NULL AND s.sslSpyEnabled <> "on"
          RETURN s.sslSpyEnabled AS sslSpyEnabled;
        SoloSeverity: 5.3
        CumulativeSeverity: 2.0
        Flag: []
        Vars:
          - Name: "evidence"
            Query: |-
              MATCH (s)
              WHERE s.sslSpyEnabled IS NOT NULL AND s.sslSpyEnabled <> "on"
              RETURN "| Setting | Property | Value |\n|---|---|---|\n" + "| Enable DPI-SSL client inspection | sslSpyEnabled | " + CASE WHEN s.sslSpyEnabled IS NULL THEN "(not set)" WHEN trim(toString(s.sslSpyEnabled)) = "" THEN "(empty)" ELSE "`" + replace(replace(replace(replace(toString(s.sslSpyEnabled), "`", "'"), "|", "\\|"), "\n", " "), "\r", " ") + "`" END + " |\n" AS Evidence;
        Sections:
          - Name: "Description"
            SoloText:
              Singular: |-
                The affected asset inspects no encrypted client traffic, because the configuration property `sslSpyEnabled` is not enabled. Gateway anti-virus, intrusion prevention, anti-spyware and content filtering cannot see malware and exploits delivered over the Hypertext Transfer Protocol Secure (HTTPS), which now carries the majority of web traffic, so these services are largely ineffective against modern threats. Attackers deliberately use encrypted channels to deliver malware and to communicate with command and control servers, because they know that many perimeter controls cannot see inside encrypted traffic. Without client inspection, the investment in gateway anti-virus, intrusion prevention and content filtering provides protection only for the shrinking proportion of traffic that is not encrypted.
